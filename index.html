<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Autonova</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#15181e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Autonova" />
  <link rel="apple-touch-icon" href="assets/img/logo.png" />
</head>
<body class="login-page">
  <div class="login-card">
    <img class="login-logo" src="assets/img/logo.png" alt="" onerror="this.style.display='none'" />
    <h1>Autonova</h1>
    <p class="subtitle">Sistema de Gestión de Taller Mecánico</p>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" style="width: 100%;">Ingresar</button>
      <p class="error-message" id="error-message"></p>
    </form>
    <p style="text-align:center; font-size:0.8rem; margin:1rem 0 0;">
      <a href="portal.html">¿Eres cliente? Consulta el estado de tu vehículo</a>
    </p>
  </div>

  <script src="assets/vendor/supabase.min.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = 'pages/dashboard.html';
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-message');
      errorEl.textContent = '';

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.textContent = 'Credenciales inválidas. Intenta nuevamente.';
        return;
      }
      window.location.href = 'pages/dashboard.html';
    });
  </script>
</body>
</html>
