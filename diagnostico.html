<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informe de diagnóstico · Autonova</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .rev-item { border: 1px solid #e5e5e5; border-left: 4px solid var(--color-primary); border-radius: 6px; padding: 0.6rem 0.8rem; margin-bottom: 0.5rem; background: #fff; }
    .rev-cab strong { font-size: 0.95rem; }
    .rev-nota { margin: 0.35rem 0 0; font-size: 0.9rem; color: var(--color-text); }
    .aviso-rechazo { background: #fff8e6; border-left: 3px solid #d97706; padding: 0.6rem 0.9rem; border-radius: 6px; margin-top: 0.75rem; font-size: 0.9rem; }
    .rev-fotos { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
    .rev-fotos img { width: 96px; height: 72px; object-fit: cover; border-radius: 4px; border: 1px solid #ccc; display: block; }
    .caja-conclusion { background: #eef4ff; border-left: 3px solid #1d4ed8; padding: 0.8rem 1rem; border-radius: 6px; }
    .siguiente-paso { background: #f4f9f5; border: 1px solid #cfe6d4; border-radius: 8px; padding: 1rem; margin-top: 1.5rem; text-align: center; }
    .siguiente-paso p { margin: 0 0 0.75rem; }
    .acciones-cliente { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
    .acciones-cliente a, .acciones-cliente button { text-decoration: none; display: inline-block; padding: 0.55rem 1.1rem; border-radius: 4px; font-size: 0.92rem; cursor: pointer; border: none; }
    .tabla-trabajos td, .tabla-trabajos th { padding: 0.55rem 0.5rem; }
    @media (max-width: 560px) {
      .tabla-trabajos th:nth-child(3), .tabla-trabajos td:nth-child(3) { display: none; }
    }
    @media print {
      .no-print { display: none !important; }
      .rev-item { break-inside: avoid; }
    }
  </style>
</head>
<body class="portal-page">
  <div class="brand-band" style="max-width:760px; width:100%; margin-bottom:1rem;">
    <img src="assets/img/logo.png" alt="Autonova" onerror="this.style.display='none'" />
    <div class="brand-band-text">
      <div class="brand-band-name" id="taller-nombre">Autonova</div>
      <div class="brand-band-sub">Informe de diagnóstico</div>
    </div>
  </div>

  <div class="portal-card" id="contenido">
    <p>Cargando informe...</p>
  </div>

  <script src="assets/vendor/supabase.min.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    const diagId = new URLSearchParams(window.location.search).get('id');

    const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const escMulti = (s) => esc(s).replace(/\n/g, '<br>');
    const urlSegura = (u) => /^https?:\/\//i.test(String(u || ''));
    const fmtHoras = (h) => Number(h).toLocaleString('es-CL', { maximumFractionDigits: 2 });

    function categoriaItem(i) {
      const sub = (i.tipo === 'otro' && i.tipo_otro) ? i.tipo_otro : i.tipo;
      if (sub === 'mano_obra') return 'mano_obra';
      if (sub === 'repuesto' || sub === 'insumo_vehiculo') return 'repuestos';
      if (sub === 'insumo_taller' || sub === 'insumo') return 'insumo_taller';
      return 'trabajo_externo';
    }

    function calcular(d) {
      const ivaPct = Number((d.taller && d.taller.iva_pct) ?? 19);
      const items = d.items || [];
      const sumaCat = (cat) => items.filter(i => categoriaItem(i) === cat).reduce((s, i) => s + Number(i.cantidad) * Number(i.precio_unitario), 0);
      const mo = sumaCat('mano_obra'), rep = sumaCat('repuestos'), ext = sumaCat('trabajo_externo'), ins = sumaCat('insumo_taller');
      const subtotal = mo + rep + ext + ins;
      // El descuento puede venir en % o en pesos (descuento_tipo); calcularDescuento está en layout.js
      const dsc = calcularDescuento(subtotal, d);
      const descuento = dsc.monto;
      const neto = subtotal - descuento;
      const conIva = d.con_iva !== false;
      const iva = conIva ? neto * (ivaPct / 100) : 0;
      const factor = subtotal > 0 ? neto / subtotal : 1;
      return {
        ivaPct, subtotal, descuento, descuentoPct: dsc.pct, neto, iva, conIva, total: neto + iva,
        subtotalMO: mo * factor, subtotalRepuestos: rep * factor,
        subtotalTrabajoExterno: ext * factor, subtotalInsumosTaller: ins * factor,
      };
    }

    const CATEGORIAS_DESGLOSE = [
      { key: 'subtotalMO', label: 'Mano de obra', color: '#1d4ed8' },
      { key: 'subtotalRepuestos', label: 'Repuestos', color: '#6b3fa0' },
      { key: 'subtotalTrabajoExterno', label: 'Trabajo externo', color: '#4b5563' },
      { key: 'subtotalInsumosTaller', label: 'Insumos de taller', color: '#92600a' },
    ];
    function renderDesgloseHTML(t, maxWidth) {
      const cats = CATEGORIAS_DESGLOSE.filter(c => t[c.key] > 0);
      if (!cats.length) return '';
      const totalCats = cats.reduce((s, c) => s + t[c.key], 0);
      const barra = cats.map(c => `<div style="width:${(t[c.key] / totalCats * 100).toFixed(2)}%; background:${c.color};"></div>`).join('');
      const filas = cats.map(c => `
        <div class="fila" style="font-size:0.85rem; color:var(--color-text-muted);">
          <span><span class="punto" style="background:${c.color};"></span>${c.label}</span>
          <span>${fmtMoneda(t[c.key])}</span>
        </div>`).join('');
      return `<div class="desglose-categorias" style="max-width:${maxWidth || 320}px;"><div class="titulo">Desglose por categoría</div><div class="barra">${barra}</div>${filas}</div>`;
    }

    // ---------- Pruebas y monitoreos ----------
    // Los diagnósticos antiguos tenían estado Óptimo/Observación: pasa a ser parte del resultado.
    function resultadoPrueba(h) {
      const estado = h.estado === 'optimo' ? 'Óptimo' : h.estado === 'observacion' ? 'Observación' : '';
      return [estado, h.nota].filter(Boolean).join(' — ');
    }

    function renderPruebas(hallazgos) {
      const pruebas = (hallazgos || []).filter(h => h.item);
      if (!pruebas.length) return '';
      const tarjetas = pruebas.map(h => {
        const fotos = (h.fotos || []).filter(urlSegura);
        const resultado = resultadoPrueba(h);
        return `<div class="rev-item">
          <div class="rev-cab"><strong>${esc(h.item)}</strong></div>
          ${resultado ? `<p class="rev-nota">${escMulti(resultado)}</p>` : ''}
          ${fotos.length ? `<div class="rev-fotos">${fotos.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" loading="lazy" alt="Foto de ${esc(h.item)}" /></a>`).join('')}</div>` : ''}
        </div>`;
      }).join('');
      return `<h3 style="margin:1.5rem 0 0.6rem;">Pruebas y monitoreos realizados</h3>${tarjetas}`;
    }

    // ---------- Qué sigue ----------
    // r = { hayTrabajos, total, totalSoloDiag, conIva } con los montos que ve el cliente
    function renderSiguientePaso(d, r) {
      const taller = d.taller || {};
      const veh = d.vehiculo;
      const mensajeConsulta = `Hola, revisé el informe de diagnóstico ${fmtNumero('DIAG', d.numero)}${veh ? ` de mi vehículo ${veh.patente}` : ''} y quisiera consultar.`;
      const waTaller = taller.telefono ? linkWhatsApp(taller.telefono, mensajeConsulta) : null;
      const btnWa = waTaller
        ? `<a href="${esc(waTaller)}" target="_blank" rel="noopener" style="background:#25d366; color:#fff;">💬 Consultar por WhatsApp</a>` : '';

      if (d.orden) {
        const seguimiento = veh
          ? `<a href="portal.html?patente=${encodeURIComponent(veh.patente)}&ot=${encodeURIComponent(d.orden.numero)}" style="background:var(--color-primary); color:#fff;">Ver el avance de la reparación</a>` : '';
        return `<div class="siguiente-paso no-print">
          <p><strong>Su vehículo ya está en taller:</strong> ${fmtNumero('OT', d.orden.numero)} ${badgeEstado(d.orden.estado, ESTADOS_ORDEN)}</p>
          <div class="acciones-cliente">${seguimiento}${btnWa}</div>
        </div>`;
      }

      const cot = d.cotizacion;
      if (cot && cot.estado === 'enviada') {
        return `<div class="siguiente-paso no-print">
          <p>Le enviamos la cotización <strong>${fmtNumero('COT', cot.numero)}</strong> con estos trabajos. Puede revisarla y aprobarla en línea.</p>
          <div class="acciones-cliente">
            <a href="cotizacion.html?id=${encodeURIComponent(cot.id)}" style="background:var(--color-primary); color:#fff;">Revisar y aprobar la cotización</a>${btnWa}
          </div>
        </div>`;
      }
      if (cot && (cot.estado === 'aprobada' || cot.estado === 'rechazada' || cot.estado === 'convertida')) {
        return `<div class="siguiente-paso no-print">
          <p>Cotización <strong>${fmtNumero('COT', cot.numero)}</strong>: ${badgeEstado(cot.estado, ESTADOS_COTIZACION)}</p>
          <div class="acciones-cliente">
            <a href="cotizacion.html?id=${encodeURIComponent(cot.id)}" style="background:var(--color-primary); color:#fff;">Ver cotización</a>
            ${cot.estado === 'aprobada' ? `<a href="reservar.html" style="background:#1b5e20; color:#fff;">📅 Agendar cita online</a>` : ''}${btnWa}
          </div>
        </div>`;
      }
      // Sin cotización (o aún en borrador, que el cliente no debe ver): decide sobre los trabajos recomendados
      const iva = r.conIva ? ' (IVA incluido)' : '';
      // d.respuesta solo existe cuando el servidor ya tiene la actualización v37; si no, se ofrece agendar como antes
      if (d.respuesta === undefined) r = { ...r, hayTrabajos: false };
      if (r.hayTrabajos && d.respuesta === 'aceptado') {
        return `<div class="siguiente-paso no-print">
          <p>✓ <strong>Registramos que usted acepta los trabajos recomendados</strong>${d.respuesta_fecha ? ` (${fmtFecha(d.respuesta_fecha)})` : ''}. El taller se pondrá en contacto para coordinar.</p>
          <div class="acciones-cliente"><a href="reservar.html" style="background:#1b5e20; color:#fff;">📅 Agendar cita online</a>${btnWa}</div>
        </div>`;
      }
      if (r.hayTrabajos && d.respuesta === 'rechazado') {
        return `<div class="siguiente-paso no-print">
          <p>Registramos que por ahora <strong>no realizará los trabajos</strong>${d.respuesta_fecha ? ` (${fmtFecha(d.respuesta_fecha)})` : ''}.
             Se cobra únicamente el diagnóstico: <strong>${fmtMoneda(r.totalSoloDiag)}</strong>${iva}. Si cambia de opinión, escríbanos.</p>
          <div class="acciones-cliente">${btnWa}</div>
        </div>`;
      }
      if (r.hayTrabajos) {
        return `<div class="siguiente-paso no-print" id="decision">
          <h3 style="margin:0 0 0.5rem;">¿Desea realizar los trabajos recomendados?</h3>
          <p>Si <strong>acepta</strong>, el total estimado es <strong>${fmtMoneda(r.total)}</strong>${iva}.<br>
             Si <strong>no</strong>, solo se cobra el diagnóstico: <strong>${fmtMoneda(r.totalSoloDiag)}</strong>${iva}.</p>
          <div class="acciones-cliente">
            <button type="button" id="aceptar-btn" style="background:#1b5e20; color:#fff;">✓ Aceptar los trabajos</button>
            <button type="button" id="rechazar-btn" style="background:#fff; color:#a93b33; border:1px solid #a93b33;">✕ No por ahora</button>
            ${btnWa}
          </div>
          <p class="error-message" id="respuesta-error"></p>
        </div>`;
      }
      return `<div class="siguiente-paso no-print">
        <p>¿Quiere que realicemos los trabajos recomendados? Agende su cita o escríbanos.</p>
        <div class="acciones-cliente">
          <a href="reservar.html" style="background:#1b5e20; color:#fff;">📅 Agendar cita online</a>${btnWa}
        </div>
      </div>`;
    }

    let datosInforme = null;   // última respuesta de la función pública (para volver a pintar)
    async function responder(resp) {
      const errorEl = document.getElementById('respuesta-error');
      if (errorEl) errorEl.textContent = '';
      const texto = resp === 'aceptado' ? 'aceptar los trabajos recomendados' : 'no realizar los trabajos por ahora (se cobra solo el diagnóstico)';
      if (!confirm(`¿Confirma que desea ${texto}?`)) return;
      const { data, error } = await supabaseClient.rpc('portal_responder_diagnostico', { p_id: diagId, p_respuesta: resp });
      if (error || (data !== 'ok' && data !== 'ya_respondido')) {
        if (errorEl) errorEl.textContent = 'No pudimos registrar su respuesta. Intente de nuevo o contacte al taller.';
        return;
      }
      if (data === 'ya_respondido') {
        // Alguien ya respondió (por ejemplo el taller): se muestra lo vigente
        const { data: actual } = await supabaseClient.rpc('portal_consultar_diagnostico', { p_id: diagId });
        if (actual) { render(actual); return; }
      }
      datosInforme.respuesta = resp;
      datosInforme.respuesta_fecha = new Date().toISOString();
      render(datosInforme);
      const bloque = document.querySelector('.siguiente-paso');
      if (bloque) bloque.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function render(d) {
      if (d.taller && d.taller.nombre) document.getElementById('taller-nombre').textContent = d.taller.nombre;
      const t = calcular(d);
      const items = d.items || [];
      const veh = d.vehiculo;
      const taller = d.taller || {};
      const desglose = renderDesgloseHTML(t, 300);
      // Mientras no haya cotización/OT, la línea del diagnóstico viene aparte de los trabajos recomendados
      const lineaDiag = items.find(i => i.es_diagnostico);
      const valorDiag = lineaDiag ? Number(lineaDiag.cantidad) * Number(lineaDiag.precio_unitario) : 0;
      const hayTrabajos = items.some(i => !i.es_diagnostico);
      const factorIva = t.conIva ? 1 + t.ivaPct / 100 : 1;
      const totalSoloDiag = valorDiag * factorIva;   // rechazando los trabajos se cobra el diagnóstico completo, sin descuento
      const descripcionItem = (i) => i.es_diagnostico ? `Diagnóstico (${fmtHoras(i.cantidad)} h de taller)` : i.descripcion;

      document.getElementById('contenido').innerHTML = `
        <div style="max-width:680px; margin:0 auto;">
          <div style="text-align:center; margin-bottom:1.25rem;">
            <h2 style="margin:0 0 0.75rem;">INFORME DE DIAGNÓSTICO ${fmtNumero('DIAG', d.numero)}</h2>
            <p style="color:var(--color-text-muted); margin:0; font-size:0.9rem;">
              <strong>${esc(d.cliente ? d.cliente.nombre : '–')}</strong>
              ${veh ? `<br>${esc(veh.patente)} · ${esc([veh.marca, veh.modelo, veh.anio].filter(Boolean).join(' '))}${d.km ? ` · ${Number(d.km).toLocaleString('es-CL')} km` : ''}` : ''}
              <br><span style="font-size:0.85rem;">Fecha: ${fmtFecha(d.fecha)}</span>
            </p>
          </div>

          ${d.motivo ? `<p style="background:#f9f9f9; padding:0.75rem 1rem; border-left:3px solid var(--color-primary); border-radius:4px;"><strong>Motivo de consulta:</strong> ${escMulti(d.motivo)}</p>` : ''}

          ${renderPruebas(d.hallazgos)}

          ${d.conclusion ? `<h3 style="margin:1.5rem 0 0.6rem;">Conclusión del diagnóstico</h3><div class="caja-conclusion">${escMulti(d.conclusion)}</div>` : ''}

          ${items.length ? `
          <h3 style="margin:1.5rem 0 0.6rem;">${d.cotizacion ? 'Detalle de trabajos' : (lineaDiag && hayTrabajos ? 'Valor del diagnóstico y trabajos recomendados' : lineaDiag ? 'Valor del diagnóstico' : 'Trabajos recomendados')}</h3>
          <table class="tabla-trabajos" style="width:100%; border-collapse:collapse; margin-bottom:1rem;">
            <thead>
              <tr style="border-bottom:2px solid var(--color-primary);">
                <th style="text-align:left;">Descripción</th>
                <th style="text-align:center; width:70px;">Cant.</th>
                <th style="text-align:right; width:100px;">P. unitario</th>
                <th style="text-align:right; width:100px;">Total</th>
              </tr>
            </thead>
            <tbody>
              ${items.map((i, idx) => `<tr style="border-bottom:${idx === items.length - 1 ? '2px solid var(--color-primary)' : '1px solid #eee'};">
                <td>${esc(descripcionItem(i))}</td>
                <td style="text-align:center;">${Number(i.cantidad).toLocaleString('es-CL')}</td>
                <td style="text-align:right; white-space:nowrap;">${fmtMoneda(i.precio_unitario)}</td>
                <td style="text-align:right; white-space:nowrap;"><strong>${fmtMoneda(Number(i.cantidad) * Number(i.precio_unitario))}</strong></td>
              </tr>`).join('')}
            </tbody>
          </table>

          <div style="max-width:320px; margin-left:auto;">
            ${(lineaDiag && hayTrabajos) ? `
            <div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid #eee;"><span>Diagnóstico</span><span>${fmtMoneda(valorDiag)}</span></div>
            <div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid #eee;"><span>Trabajos recomendados</span><span>${fmtMoneda(t.subtotal - valorDiag)}</span></div>` : ''}
            ${t.descuento > 0 ? `<div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid #eee;"><span>Descuento (${fmtPorcentaje(t.descuentoPct)}%)</span><span style="color:#c33;">-${fmtMoneda(t.descuento)}</span></div>` : ''}
            <div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid #eee;"><span>Neto</span><span>${fmtMoneda(t.neto)}</span></div>
            ${t.conIva ? `<div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:2px solid var(--color-primary);"><span>IVA ${t.ivaPct}%</span><span>${fmtMoneda(t.iva)}</span></div>` : ''}
            <div style="display:flex; justify-content:space-between; padding:0.6rem 0; font-weight:700; font-size:1.1rem;"><span>${d.cotizacion ? 'TOTAL' : hayTrabajos ? 'TOTAL SI SE REALIZAN LOS TRABAJOS' : lineaDiag ? 'TOTAL DEL DIAGNÓSTICO' : 'TOTAL ESTIMADO'}</span><span style="color:var(--color-primary);">${fmtMoneda(t.total)}</span></div>
          </div>
          ${(!d.cotizacion && lineaDiag && hayTrabajos) ? `<div class="aviso-rechazo">Si decide <strong>no realizar</strong> los trabajos, solo se cobra el diagnóstico: <strong>${fmtMoneda(totalSoloDiag)}</strong>${t.conIva ? ' (IVA incluido)' : ''}.</div>` : ''}
          ${desglose ? `<div style="margin-top:0.5rem;">${desglose}</div>` : ''}
          <p style="font-size:0.8rem; color:var(--color-text-muted); margin-top:0.75rem;">Valores referenciales según lo observado a la fecha del informe. Cualquier hallazgo adicional se informará y cotizará antes de realizarse.</p>` : ''}

          ${renderSiguientePaso(d, { hayTrabajos, total: t.total, totalSoloDiag, conIva: t.conIva })}

          <div class="no-print" style="text-align:center; margin-top:1rem;">
            <button type="button" class="btn-secondary" onclick="window.print()">🖨 Imprimir / Guardar PDF</button>
          </div>

          <div style="text-align:center; color:var(--color-text-muted); font-size:0.8rem; margin-top:2rem; padding-top:1rem; border-top:1px solid #eee;">
            <p style="margin:0.25rem 0;"><strong>${esc(taller.nombre || '')}</strong></p>
            <p style="margin:0.1rem 0; font-size:0.75rem;">${esc(taller.direccion ?? '')}${taller.direccion && taller.telefono ? ' · ' : ''}${esc(taller.telefono ?? '')}</p>
          </div>
          ${taller.politica_inspeccion_texto ? `<div style="margin-top:1.5rem; background:#fef3c7; padding:0.75rem 1rem; border-radius:6px; font-size:0.78rem; white-space:pre-wrap;">${esc(taller.politica_inspeccion_texto)}</div>` : ''}
          ${taller.politicas_generales_texto ? `<div style="margin-top:1.5rem; padding-top:0.75rem; border-top:1px solid #eee; font-size:0.7rem; color:#999; white-space:pre-wrap;">${esc(taller.politicas_generales_texto)}</div>` : ''}
        </div>`;

      datosInforme = d;
      const aceptar = document.getElementById('aceptar-btn');
      if (aceptar) {
        aceptar.addEventListener('click', () => responder('aceptado'));
        document.getElementById('rechazar-btn').addEventListener('click', () => responder('rechazado'));
      }
    }

    (async () => {
      const contenido = document.getElementById('contenido');
      if (!diagId) {
        contenido.innerHTML = '<p class="error-message">Link inválido: falta el identificador del informe.</p>';
        return;
      }
      const { data, error } = await supabaseClient.rpc('portal_consultar_diagnostico', { p_id: diagId });
      if (error || !data) {
        contenido.innerHTML = '<p class="error-message">No encontramos este informe. Verifica el link o contacta al taller.</p>';
        return;
      }
      render(data);
    })();
  </script>
</body>
</html>
