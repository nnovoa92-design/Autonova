<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehículos · Autonova</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <h1>Vehículos</h1>
      </header>
      <div class="content">

        <div class="card" id="form-card">
          <h2 id="form-title" style="margin-top:0;">Nuevo vehículo</h2>
          <form id="vehiculo-form">
            <input type="hidden" id="vehiculo-id" />
            <div class="form-row">
              <div class="form-group">
                <label for="cliente_id">Cliente *</label>
                <select id="cliente_id" required></select>
              </div>
              <div class="form-group">
                <label for="patente">Patente *</label>
                <input type="text" id="patente" required placeholder="ABCD12" style="text-transform:uppercase;" />
              </div>
              <div class="form-group">
                <label for="marca">Marca</label>
                <input type="text" id="marca" />
              </div>
              <div class="form-group">
                <label for="modelo">Modelo</label>
                <input type="text" id="modelo" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="anio">Año</label>
                <input type="number" id="anio" min="1950" max="2100" />
              </div>
              <div class="form-group">
                <label for="kilometraje">Kilometraje</label>
                <input type="number" id="kilometraje" min="0" />
              </div>
              <div class="form-group">
                <label for="motor">Motor</label>
                <input type="text" id="motor" placeholder="1.6 16v" />
              </div>
              <div class="form-group">
                <label for="vin">VIN / Chasis</label>
                <input type="text" id="vin" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="combustible">Combustible</label>
                <select id="combustible">
                  <option value="">–</option><option>Gasolina</option><option>Diésel</option><option>Híbrido</option><option>Eléctrico</option><option>Gas</option>
                </select>
              </div>
              <div class="form-group">
                <label for="tipo_vehiculo">Tipo de vehículo</label>
                <input type="text" id="tipo_vehiculo" placeholder="Automóvil, camioneta, SUV…" />
              </div>
              <div class="form-group">
                <label for="numero_motor">N° de motor</label>
                <input type="text" id="numero_motor" />
              </div>
              <div class="form-group">
                <label for="color">Color</label>
                <input type="text" id="color" />
              </div>
              <div class="form-group">
                <label for="transmision">Transmisión</label>
                <select id="transmision"><option value="">–</option><option>Manual</option><option>Automática</option></select>
              </div>
            </div>
            <div class="form-group">
              <label for="notas">Notas</label>
              <input type="text" id="notas" />
            </div>
            <button type="submit" id="submit-btn">Guardar vehículo</button>
            <button type="button" id="cancel-btn" class="btn-secondary" style="display:none;">Cancelar edición</button>
            <p class="error-message" id="form-error"></p>
          </form>
        </div>

        <!-- Expediente: todo lo que se ha hecho con el vehículo -->
        <div class="card" id="expediente-card" style="display:none; margin-top:1rem;">
          <div class="toolbar">
            <h2 style="margin:0;" id="exp-titulo">Expediente</h2>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
              <button type="button" id="exp-pdf-btn" class="btn-secondary">📄 PDF del historial</button>
              <button type="button" id="exp-cerrar-btn" class="btn-secondary">Cerrar</button>
            </div>
          </div>
          <div id="exp-resumen"></div>
          <div id="exp-filtros" class="exp-filtros"></div>
          <div id="exp-lista" class="exp-lista"></div>
        </div>

        <div class="card" style="margin-top:1rem;">
          <div class="toolbar">
            <h2 style="margin:0;">Listado</h2>
            <input type="search" id="buscar" placeholder="Buscar por patente, marca o cliente..." style="max-width:320px;" />
          </div>
          <table>
            <thead>
              <tr>
                <th>Patente</th>
                <th>Vehículo</th>
                <th>Año</th>
                <th>Km</th>
                <th>Cliente</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="vehiculos-body">
              <tr><td colspan="6">Cargando...</td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script src="../assets/vendor/supabase.min.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    let vehiculosCache = [];
    let clientesCache = [];
    let config = null;

    // ---------- Expediente del vehículo ----------
    // Todo lo que se ha hecho con el vehículo, del más reciente al más antiguo: citas (también canceladas o sin
    // asistencia), diagnósticos, cotizaciones (también rechazadas o vencidas), OT con sus pagos e inspección de
    // ingreso, inspecciones precompra, recordatorios y correos enviados.
    const TIPOS_EXPEDIENTE = {
      cita:         { icono: '📅', label: 'Agenda' },
      diagnostico:  { icono: '🩺', label: 'Diagnósticos' },
      cotizacion:   { icono: '📝', label: 'Cotizaciones' },
      ot:           { icono: '🔧', label: 'Órdenes de trabajo' },
      inspeccion:   { icono: '🔍', label: 'Inspecciones precompra' },
      recordatorio: { icono: '⏰', label: 'Recordatorios' },
      correo:       { icono: '✉️', label: 'Correos' },
    };
    const ESTADOS_CITA_EXP = {
      pendiente:  { label: 'Por confirmar', badge: 'badge-yellow' },
      confirmado: { label: 'Confirmada', badge: 'badge-blue' },
      completado: { label: 'Atendida', badge: 'badge-green' },
      cancelado:  { label: 'Cancelada', badge: 'badge-red' },
      ausente:    { label: 'No asistió', badge: 'badge-gray' },
    };
    let expediente = null;     // { vehiculo, eventos, resumen }
    const fmtHora = (iso) => new Date(iso).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Santiago' });
    let filtroExpediente = '';

    const badge = (texto, clase) => `<span class="badge ${clase || ''}">${htmlSeguro(texto)}</span>`;
    const conIvaDe = (neto, conIva) => conIva === false ? neto : neto * (1 + Number(config.iva_pct ?? 19) / 100);
    const listaItems = (items) => (items || []).map(i => i.descripcion).filter(Boolean).join(' · ');

    async function cargarExpediente(v) {
      const pat = normalizarPatente(v.patente);
      const q = (p) => p.then(r => r.data || []).catch(() => []);
      const [citas, diags, cots, ots, insps, recs, correos] = await Promise.all([
        q(supabaseClient.from('citas').select('*, trabajos(nombre), clientes(nombre)').or(`vehiculo_id.eq.${v.id},patente_contacto.ilike.${pat}`)),
        q(supabaseClient.from('diagnosticos').select('*, diagnostico_items(*), clientes(nombre)').eq('vehiculo_id', v.id)),
        q(supabaseClient.from('cotizaciones').select('*, cotizacion_items(*), clientes(nombre), ordenes(id, numero, estado, descuento_tipo, descuento_pct, descuento_monto, descuento_base, con_iva, orden_items(cantidad, precio_unitario, tipo, tipo_otro))').eq('vehiculo_id', v.id)),
        q(supabaseClient.from('ordenes').select('*, orden_items(*), pagos(monto), abonos(monto), clientes(nombre)').eq('vehiculo_id', v.id)),
        q(supabaseClient.from('inspecciones').select('*').or(`vehiculo_id.eq.${v.id},patente.ilike.${pat}`)),
        q(supabaseClient.from('recordatorios').select('*').eq('vehiculo_id', v.id)),
        q(supabaseClient.from('correos_enviados').select('*').eq('vehiculo_id', v.id)),
      ]);
      const hoy = hoyChile();
      const eventos = [];
      const quien = (c) => (c && c.clientes && c.clientes.nombre && c.cliente_id !== v.cliente_id) ? c.clientes.nombre : '';

      citas.forEach(c => {
        const e = ESTADOS_CITA_EXP[c.estado] || { label: c.estado, badge: '' };
        const futura = new Date(c.fecha_hora) > new Date() && (c.estado === 'confirmado' || c.estado === 'pendiente');
        eventos.push({
          tipo: 'cita', fecha: c.fecha_hora, futura,
          titulo: `Cita ${fmtHora(c.fecha_hora)}${c.origen === 'online' ? ' · reserva web' : ''}`,
          estado: badge(e.label, e.badge),
          detalle: [c.trabajos ? c.trabajos.nombre : (c.descripcion || ''), c.notas, c.modalidad === 'terreno' ? 'A domicilio' : ''].filter(Boolean).join(' · '),
          persona: quien(c) || (!c.cliente_id && c.nombre_contacto ? c.nombre_contacto : ''),
          link: `agenda.html?fecha=${ymdChile(c.fecha_hora)}`,
        });
      });

      diags.forEach(d => {
        const monto = (Number(d.horas_diagnostico) || 0) * (Number(d.valor_hora_diagnostico) || 0);
        const resp = d.cotizacion_id ? badge('Cotizado', 'badge-blue')
          : d.respuesta === 'aceptado' ? badge('Aceptado', 'badge-green')
          : d.respuesta === 'rechazado' ? badge('Rechazado', 'badge-red') : badge('Sin respuesta', 'badge-gray');
        eventos.push({
          tipo: 'diagnostico', fecha: d.fecha || d.creado_en, km: d.km,
          titulo: fmtNumero('DIAG', d.numero), estado: resp,
          detalle: [d.motivo ? `Motivo: ${d.motivo}` : '', d.conclusion ? `Conclusión: ${d.conclusion}` : '', (d.hallazgos || []).length ? `${d.hallazgos.length} prueba(s)` : '', listaItems(d.diagnostico_items) ? `Recomienda: ${listaItems(d.diagnostico_items)}` : ''].filter(Boolean).join(' · '),
          montos: monto > 0 ? `Valor del diagnóstico: ${fmtMoneda(monto)} + IVA` : '',
          ingreso: (d.checklist_recepcion || []).length ? `📋 Inspección de ingreso (${d.checklist_recepcion.length} punto${d.checklist_recepcion.length === 1 ? '' : 's'}${d.checklist_firma_fecha ? ', firmada' : ''})` : '',
          persona: quien(d),
          link: `diagnosticos.html?id=${d.id}`,
        });
      });

      cots.forEach(c => {
        const vence = sumarDiasYmd(String(c.fecha || c.creado_en).slice(0, 10), Number(c.validez_dias) || 15);
        const vencida = c.estado === 'enviada' && vence < hoy;
        const e = ESTADOS_COTIZACION[c.estado] || { label: c.estado, badge: '' };
        eventos.push({
          tipo: 'cotizacion', fecha: c.creado_en || c.fecha,
          titulo: fmtNumero('COT', c.numero),
          estado: badge(e.label, e.badge) + (vencida ? ' ' + badge('Vencida', 'badge-gray') : ''),
          detalle: listaItems(c.cotizacion_items),
          montos: `Total ${fmtMoneda(totalVigenteCotizacion(c, config.iva_pct))}${c.estado === 'enviada' && !vencida ? ` · válida hasta el ${fmtFecha(vence + 'T12:00:00')}` : ''}`,
          persona: quien(c),
          link: `cotizaciones.html?id=${c.id}`,
        });
      });

      let gastado = 0, saldo = 0;
      ots.forEach(o => {
        const total = conIvaDe(descuentoDeItems(o.orden_items, o).neto, o.con_iva);
        const pagado = [...(o.pagos || []), ...(o.abonos || [])].reduce((s, p) => s + Number(p.monto || 0), 0);
        if (o.estado !== 'cancelado') { gastado += total; saldo += Math.max(0, total - pagado); }
        const e = ESTADOS_ORDEN[o.estado] || { label: o.estado, badge: '' };
        eventos.push({
          tipo: 'ot', fecha: o.fecha_ingreso || o.creado_en, km: o.km_ingreso,
          titulo: fmtNumero('OT', o.numero),
          estado: badge(e.label, e.badge) + (o.estado !== 'cancelado' && total - pagado > 1 ? ' ' + badge('Saldo pendiente', 'badge-yellow') : ''),
          detalle: [o.diagnostico ? `Motivo: ${o.diagnostico}` : '', listaItems(o.orden_items)].filter(Boolean).join(' · '),
          montos: `Total ${fmtMoneda(total)} · Pagado ${fmtMoneda(pagado)}${total - pagado > 1 ? ` · Saldo ${fmtMoneda(total - pagado)}` : ''}${o.fecha_entrega ? ` · Entregado el ${fmtFecha(o.fecha_entrega)}` : ''}`,
          ingreso: (o.checklist_recepcion || []).length ? `📋 Inspección de ingreso (${o.checklist_recepcion.length} punto${o.checklist_recepcion.length === 1 ? '' : 's'}${o.checklist_firma_fecha || o.firma_cliente_url ? ', firmada' : ''})` : '',
          persona: quien(o),
          link: `ordenes.html?id=${o.id}`,
        });
      });

      insps.forEach(i => {
        const plan = typeof inspPlanDe === 'function' ? inspPlanDe(i.datos) : (i.datos && i.datos._plan);
        const nivel = { ok: 'badge-green', warn: 'badge-yellow', bad: 'badge-red' }[i.score >= 85 ? 'ok' : (i.score >= 60 ? 'warn' : 'bad')];
        eventos.push({
          tipo: 'inspeccion', fecha: i.fecha, km: i.km ? String(i.km).replace(/[^\d]/g, '') : null,
          titulo: `${fmtNumero('INS', i.numero)}${plan ? ` · ${plan.nombre}` : ''}`,
          estado: badge(`${i.score ?? '–'}/100`, nivel),
          detalle: [i.nombre_comprador ? `Comprador: ${i.nombre_comprador}` : '', i.recomendacion].filter(Boolean).join(' · '),
          link: `inspecciones.html?id=${i.id}`,
        });
      });

      recs.forEach(r => {
        eventos.push({
          tipo: 'recordatorio', fecha: r.fecha_objetivo + 'T12:00:00', futura: !r.enviado && r.fecha_objetivo >= hoy,
          titulo: r.tipo === 'revision_tecnica' ? 'Recordatorio de revisión técnica' : 'Recordatorio de mantención',
          estado: r.enviado ? badge('Enviado', 'badge-green') : badge(r.fecha_objetivo >= hoy ? 'Programado' : 'Sin enviar', r.fecha_objetivo >= hoy ? 'badge-blue' : 'badge-gray'),
          detalle: r.detalle || '',
        });
      });

      correos.forEach(c => {
        eventos.push({
          tipo: 'correo', fecha: c.creado_en,
          titulo: c.asunto || 'Correo',
          estado: c.estado === 'enviado' ? badge('Enviado', 'badge-green') : badge(c.estado === 'error' ? 'Falló' : 'Sin confirmar', c.estado === 'error' ? 'badge-red' : 'badge-yellow'),
          detalle: `Para ${c.para}`,
          texto: c.texto,
        });
      });

      eventos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
      const kms = eventos.map(e => Number(e.km)).filter(n => n > 0);
      const atendidas = eventos.filter(e => e.tipo === 'ot');
      const proxima = eventos.filter(e => e.futura && e.tipo === 'cita').sort((a, b) => new Date(a.fecha) - new Date(b.fecha))[0];
      return {
        vehiculo: v, eventos,
        resumen: {
          kmActual: Math.max(Number(v.kilometraje) || 0, ...kms, 0),
          gastado, saldo,
          visitas: atendidas.length,
          ultima: atendidas.length ? atendidas[0].fecha : null,
          proxima: proxima ? proxima.fecha : null,
          cotPendientes: cots.filter(c => c.estado === 'enviada').length,
        },
      };
    }

    async function verExpediente(vehiculoId) {
      const v = vehiculosCache.find(x => x.id === vehiculoId);
      if (!v) return;
      const card = document.getElementById('expediente-card');
      card.style.display = 'block';
      document.getElementById('exp-titulo').textContent = `Expediente ${v.patente} · ${[v.marca, v.modelo, v.anio].filter(Boolean).join(' ')}`;
      document.getElementById('exp-resumen').innerHTML = '';
      document.getElementById('exp-filtros').innerHTML = '';
      document.getElementById('exp-lista').innerHTML = '<p style="color:var(--color-text-muted);">Cargando el historial…</p>';
      card.scrollIntoView({ behavior: 'smooth' });
      expediente = await cargarExpediente(v);
      filtroExpediente = '';
      renderExpediente();
    }

    function renderExpediente() {
      if (!expediente) return;
      const { vehiculo: v, eventos, resumen: r } = expediente;
      const cliente = clientesCache.find(c => c.id === v.cliente_id);
      const dato = (etiqueta, valor) => valor ? `<div class="exp-dato"><span>${etiqueta}</span><strong>${valor}</strong></div>` : '';
      document.getElementById('exp-resumen').innerHTML = `
        <div class="exp-resumen">
          ${dato('Dueño', cliente ? htmlSeguro(cliente.nombre) + (cliente.telefono ? `<small>${htmlSeguro(cliente.telefono)}</small>` : '') : '–')}
          ${dato('Kilometraje', r.kmActual ? `${r.kmActual.toLocaleString('es-CL')} km` : '–')}
          ${dato('Visitas al taller', String(r.visitas))}
          ${dato('Total en trabajos', fmtMoneda(r.gastado))}
          ${r.saldo > 1 ? dato('Saldo pendiente', `<span style="color:#a93b33;">${fmtMoneda(r.saldo)}</span>`) : ''}
          ${dato('Última visita', r.ultima ? fmtFecha(r.ultima) : '–')}
          ${r.proxima ? dato('Próxima cita', `${fmtFecha(r.proxima)} ${fmtHora(r.proxima)}`) : ''}
          ${r.cotPendientes ? dato('Cotizaciones por responder', String(r.cotPendientes)) : ''}
        </div>`;
      const cuenta = (t) => eventos.filter(e => e.tipo === t).length;
      document.getElementById('exp-filtros').innerHTML =
        `<button type="button" class="exp-filtro${!filtroExpediente ? ' activo' : ''}" data-tipo="">Todo (${eventos.length})</button>` +
        Object.entries(TIPOS_EXPEDIENTE).filter(([t]) => cuenta(t)).map(([t, info]) =>
          `<button type="button" class="exp-filtro${filtroExpediente === t ? ' activo' : ''}" data-tipo="${t}">${info.icono} ${info.label} (${cuenta(t)})</button>`).join('');
      const lista = eventos.filter(e => !filtroExpediente || e.tipo === filtroExpediente);
      document.getElementById('exp-lista').innerHTML = lista.length ? lista.map(e => `
        <div class="exp-evento${e.futura ? ' futura' : ''}">
          <div class="exp-icono" title="${TIPOS_EXPEDIENTE[e.tipo].label}">${TIPOS_EXPEDIENTE[e.tipo].icono}</div>
          <div class="exp-cuerpo">
            <div class="exp-cab">
              <span class="exp-fecha">${fmtFecha(e.fecha)}</span>
              <strong>${htmlSeguro(e.titulo)}</strong>
              ${e.estado || ''}
              ${e.km ? `<span class="exp-km">${Number(e.km).toLocaleString('es-CL')} km</span>` : ''}
            </div>
            ${e.persona ? `<div class="exp-persona">👤 ${htmlSeguro(e.persona)}</div>` : ''}
            ${e.detalle ? `<div class="exp-detalle">${htmlSeguro(e.detalle)}</div>` : ''}
            ${e.ingreso ? `<div class="exp-detalle">${htmlSeguro(e.ingreso)}</div>` : ''}
            ${e.montos ? `<div class="exp-montos">${htmlSeguro(e.montos)}</div>` : ''}
            ${e.texto ? `<details class="exp-texto"><summary>Ver correo</summary><div>${htmlSeguroMulti(e.texto)}</div></details>` : ''}
            ${e.link ? `<a class="exp-abrir" href="${e.link}">Abrir →</a>` : ''}
          </div>
        </div>`).join('')
        : '<p style="color:var(--color-text-muted);">Este vehículo aún no tiene movimientos registrados.</p>';
    }

    // PDF del historial (sirve también para entregarlo al cliente o al vender el auto). Sin correos internos.
    function construirPdfExpediente() {
      const { vehiculo: v, eventos, resumen: r } = expediente;
      const cliente = clientesCache.find(c => c.id === v.cliente_id);
      const filas = eventos.filter(e => e.tipo !== 'correo').map(e => `
        <tr>
          <td style="white-space:nowrap; vertical-align:top;">${fmtFecha(e.fecha)}</td>
          <td style="vertical-align:top;">${TIPOS_EXPEDIENTE[e.tipo].icono} <strong>${htmlSeguro(e.titulo)}</strong> ${e.estado || ''}
            ${e.detalle ? `<div style="font-size:11px; color:#4b5563;">${htmlSeguro(e.detalle)}</div>` : ''}
            ${e.montos ? `<div style="font-size:11px;">${htmlSeguro(e.montos)}</div>` : ''}</td>
          <td style="white-space:nowrap; vertical-align:top; text-align:right;">${e.km ? Number(e.km).toLocaleString('es-CL') + ' km' : ''}</td>
        </tr>`).join('');
      return `
        <div class="print-brand">
          <img src="../assets/img/logo.png" alt="" onerror="this.style.display='none'" />
          <span class="print-brand-name">${htmlSeguro(config.nombre || '')}</span>
        </div>
        <h2 style="margin:0.5rem 0 0.25rem;">Historial del vehículo ${htmlSeguro(v.patente)}</h2>
        <p style="margin:0 0 0.75rem;">
          ${htmlSeguro([v.marca, v.modelo, v.anio].filter(Boolean).join(' '))}${v.vin ? ` · VIN ${htmlSeguro(v.vin)}` : ''}${r.kmActual ? ` · ${r.kmActual.toLocaleString('es-CL')} km` : ''}<br>
          ${cliente ? `Dueño: ${htmlSeguro(cliente.nombre)} · ` : ''}${r.visitas} visita(s) al taller · Emitido el ${fmtFecha(new Date().toISOString())}
        </p>
        <table style="width:100%; border-collapse:collapse; font-size:12px;">
          <thead><tr><th style="text-align:left;">Fecha</th><th style="text-align:left;">Movimiento</th><th style="text-align:right;">Km</th></tr></thead>
          <tbody>${filas || '<tr><td colspan="3">Sin movimientos.</td></tr>'}</tbody>
        </table>
        <p style="font-size:11px; color:#6b7280; margin-top:0.75rem;">${htmlSeguro([config.direccion, config.telefono, config.email].filter(Boolean).join(' · '))}</p>`;
    }

    document.getElementById('exp-filtros').addEventListener('click', (e) => {
      const b = e.target.closest('.exp-filtro');
      if (!b) return;
      filtroExpediente = b.dataset.tipo;
      renderExpediente();
    });
    document.getElementById('exp-cerrar-btn').addEventListener('click', () => {
      document.getElementById('expediente-card').style.display = 'none';
      expediente = null;
    });
    document.getElementById('exp-pdf-btn').addEventListener('click', () => {
      if (expediente) abrirVentanaImpresion(construirPdfExpediente(), `Historial ${expediente.vehiculo.patente}`);
    });

    function clearForm() {
      ['vehiculo-id','patente','marca','modelo','anio','kilometraje','motor','vin','combustible','tipo_vehiculo','numero_motor','color','transmision','notas'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('cliente_id').value = '';
      document.getElementById('form-title').textContent = 'Nuevo vehículo';
      document.getElementById('submit-btn').textContent = 'Guardar vehículo';
      document.getElementById('cancel-btn').style.display = 'none';
      document.getElementById('form-error').textContent = '';
    }

    function fillForm(v) {
      document.getElementById('vehiculo-id').value = v.id;
      document.getElementById('cliente_id').value = v.cliente_id ?? '';
      document.getElementById('patente').value = v.patente ?? '';
      document.getElementById('marca').value = v.marca ?? '';
      document.getElementById('modelo').value = v.modelo ?? '';
      document.getElementById('anio').value = v.anio ?? '';
      document.getElementById('kilometraje').value = v.kilometraje ?? '';
      document.getElementById('motor').value = v.motor ?? '';
      document.getElementById('vin').value = v.vin ?? '';
      ['combustible','tipo_vehiculo','numero_motor','color','transmision'].forEach(id => {
        const el = document.getElementById(id);
        const val = v[id] ?? '';
        if (el.tagName === 'SELECT' && val && ![...el.options].some(o => o.value === val || o.text === val)) el.add(new Option(val, val));
        el.value = val;
      });
      document.getElementById('notas').value = v.notas ?? '';
      document.getElementById('form-title').textContent = `Editar vehículo: ${v.patente}`;
      document.getElementById('submit-btn').textContent = 'Actualizar vehículo';
      document.getElementById('cancel-btn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderVehiculos(vehiculos) {
      const tbody = document.getElementById('vehiculos-body');
      if (!vehiculos.length) {
        tbody.innerHTML = '<tr><td colspan="6">No se encontraron vehículos.</td></tr>';
        return;
      }
      tbody.innerHTML = vehiculos.map(v => {
        const cliente = clientesCache.find(c => c.id === v.cliente_id);
        return `
        <tr>
          <td><button type="button" class="exp-patente" data-id="${v.id}" title="Ver expediente">${htmlSeguro(v.patente)}</button></td>
          <td>${[v.marca, v.modelo].filter(Boolean).join(' ') || '–'}</td>
          <td>${v.anio ?? '–'}</td>
          <td>${v.kilometraje != null ? Number(v.kilometraje).toLocaleString('es-CL') : '–'}</td>
          <td>${cliente ? cliente.nombre : '–'}</td>
          <td class="table-actions">
            <button type="button" class="btn-secondary historial-btn" data-id="${v.id}">📋 Expediente</button>
            <button type="button" class="btn-secondary edit-btn" data-id="${v.id}">Editar</button>
            <button type="button" class="btn-danger delete-btn" data-id="${v.id}">Desactivar</button>
          </td>
        </tr>`;
      }).join('');

      tbody.querySelectorAll('.historial-btn, .exp-patente').forEach(btn => {
        btn.addEventListener('click', () => verExpediente(btn.dataset.id));
      });

      tbody.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const v = vehiculosCache.find(x => x.id === btn.dataset.id);
          if (v) fillForm(v);
        });
      });

      tbody.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('¿Desactivar este vehículo?')) return;
          const { error } = await supabaseClient.from('vehiculos').update({ activo: false }).eq('id', btn.dataset.id);
          if (!error) await loadVehiculos();
        });
      });
    }

    function applyFilter() {
      const q = document.getElementById('buscar').value.trim().toLowerCase();
      if (!q) { renderVehiculos(vehiculosCache); return; }
      const filtered = vehiculosCache.filter(v => {
        const cliente = clientesCache.find(c => c.id === v.cliente_id);
        return (v.patente || '').toLowerCase().includes(q) ||
               (v.marca || '').toLowerCase().includes(q) ||
               (v.modelo || '').toLowerCase().includes(q) ||
               (cliente && cliente.nombre.toLowerCase().includes(q));
      });
      renderVehiculos(filtered);
    }

    async function loadClientes() {
      const { data } = await supabaseClient.from('clientes').select('id, nombre, telefono, email').eq('activo', true).order('nombre');
      clientesCache = data || [];
      document.getElementById('cliente_id').innerHTML =
        '<option value="">Seleccionar cliente...</option>' +
        clientesCache.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
    }

    async function loadVehiculos() {
      const { data, error } = await supabaseClient.from('vehiculos').select('*').eq('activo', true).order('patente');
      if (error) {
        document.getElementById('vehiculos-body').innerHTML = `<tr><td colspan="6">Error: ${error.message}</td></tr>`;
        return;
      }
      vehiculosCache = data;
      applyFilter();
    }

    document.getElementById('buscar').addEventListener('input', applyFilter);
    document.getElementById('cancel-btn').addEventListener('click', clearForm);

    document.getElementById('vehiculo-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('form-error');
      errorEl.textContent = '';

      const id = document.getElementById('vehiculo-id').value;
      const payload = {
        cliente_id: document.getElementById('cliente_id').value,
        patente: document.getElementById('patente').value.trim().toUpperCase(),
        marca: document.getElementById('marca').value || null,
        modelo: document.getElementById('modelo').value || null,
        anio: document.getElementById('anio').value || null,
        kilometraje: document.getElementById('kilometraje').value || null,
        motor: document.getElementById('motor').value || null,
        vin: document.getElementById('vin').value || null,
        combustible: document.getElementById('combustible').value || null,
        tipo_vehiculo: document.getElementById('tipo_vehiculo').value.trim() || null,
        numero_motor: document.getElementById('numero_motor').value.trim() || null,
        color: document.getElementById('color').value.trim() || null,
        transmision: document.getElementById('transmision').value || null,
        notas: document.getElementById('notas').value || null,
      };

      let error;
      if (id) {
        ({ error } = await supabaseClient.from('vehiculos').update(payload).eq('id', id));
      } else {
        ({ error } = await supabaseClient.from('vehiculos').insert(payload));
      }

      // Aún sin v51 (campos nuevos de la ficha): se guarda sin ellos y se avisa
      if (faltaColumnaNueva(error)) {
        const nuevos = ['combustible', 'tipo_vehiculo', 'numero_motor', 'color', 'transmision'];
        const perdidos = nuevos.filter(k => payload[k]);
        const base = { ...payload };
        nuevos.forEach(k => delete base[k]);
        if (id) ({ error } = await supabaseClient.from('vehiculos').update(base).eq('id', id));
        else ({ error } = await supabaseClient.from('vehiculos').insert(base));
        if (!error && perdidos.length) {
          alert('El vehículo se guardó, pero estos datos no: ' + perdidos.join(', ') + '.\nFalta ejecutar sql/actualizacion-v51-datos-del-vehiculo.sql en Supabase.');
        }
      }

      if (error) {
        errorEl.textContent = `Error: ${error.message}`;
        return;
      }
      clearForm();
      await loadVehiculos();
    });

    (async () => {
      const session = await initLayout('vehiculos');
      if (!session) return;
      config = await getTallerConfig();
      await loadClientes();
      await loadVehiculos();
      // Desde una OT, una cotización, un cliente…: vehiculos.html?expediente=<id del vehículo>
      const expParam = new URLSearchParams(window.location.search).get('expediente');
      if (expParam && vehiculosCache.some(v => v.id === expParam)) verExpediente(expParam);
    })();
  </script>
</body>
</html>
