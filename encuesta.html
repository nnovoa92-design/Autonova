<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Cómo te fue? · Autonova</title>
  <meta name="description" content="Encuesta de satisfacción de Autonova: 30 segundos." />
  <meta property="og:title" content="⭐ ¿Cómo te fue con Autonova?" />
  <meta property="og:description" content="Cuéntanos en 30 segundos: tu opinión nos ayuda a mejorar." />
  <meta property="og:image" content="https://autonova.nnovoa92.workers.dev/assets/img/logo.png" />
  <meta name="theme-color" content="#0d0e11" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    :root { --oro: #d4a84b; --oro-claro: #f0cf7e; --rojo: #e1341e; --fondo: #0d0e11; --panel: #16181d; --borde: #2a2e37; --suave: #a7adb8; }
    html, body { background: var(--fondo); }
    body { color: #f4f5f7; min-height: 100vh; margin: 0; }
    .enc { max-width: 560px; margin: 0 auto; padding: 1.1rem 16px 3rem; }
    .enc-logo { display: block; width: min(190px, 52vw); margin: 0 auto 0.25rem;
      -webkit-mask-image: radial-gradient(ellipse 50% 50% at center, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at center, #000 62%, transparent 100%); }
    .eyebrow { text-align: center; font-family: var(--font-display); letter-spacing: 0.22em; font-size: 0.78rem; color: var(--oro); margin: 0 0 0.4rem; text-transform: uppercase; }
    .enc h1 { font-family: var(--font-display); text-transform: uppercase; text-align: center; font-size: clamp(1.6rem, 7vw, 2.2rem); line-height: 1.12; margin: 0 0 0.5rem; }
    .enc h1 .oro { color: var(--oro-claro); }
    .sub { text-align: center; color: var(--suave); margin: 0 auto 1.25rem; max-width: 30rem; }
    .sub strong { color: #fff; }
    .panel { background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 1rem; }
    .panel h2 { font-size: 1.02rem; margin: 0 0 0.75rem; color: #fff; font-family: var(--font-body); font-weight: 700; text-transform: none; letter-spacing: 0; }
    .panel h2 small { color: var(--suave); font-weight: 400; font-size: 0.82rem; }
    .estrellas { display: flex; justify-content: center; gap: 0.35rem; }
    .estrella { background: none; border: none; padding: 0.15rem; font-size: clamp(2.3rem, 12vw, 3rem); line-height: 1; cursor: pointer; color: #3a3f4a; transition: transform 0.12s, color 0.12s; }
    .estrella.on { color: var(--oro); }
    .estrella:active { transform: scale(0.9); }
    .estrella:hover { background: none; }
    .nota-texto { text-align: center; color: var(--oro-claro); font-weight: 700; min-height: 1.4em; margin: 0.4rem 0 0; }
    .nps { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
    .nps button { padding: 0.55rem 0; font-size: 0.9rem; border-radius: 8px; background: #1f232b; border: 1px solid var(--borde); color: #fff; font-weight: 700; }
    .nps button:hover { background: #2a2f39; border-color: var(--oro); }
    .nps button.on { background: var(--oro); color: #15181e; border-color: var(--oro); }
    .nps-leyenda { display: flex; justify-content: space-between; color: var(--suave); font-size: 0.75rem; margin-top: 0.35rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .chip { background: #1f232b; border: 1px solid var(--borde); color: #e6e8ec; border-radius: 999px; padding: 0.5rem 0.85rem; font-size: 0.9rem; font-weight: 600; }
    .chip:hover { background: #2a2f39; border-color: var(--oro); }
    .chip.on { background: rgba(212, 168, 75, 0.18); border-color: var(--oro); color: #fff; }
    textarea.coment { width: 100%; min-height: 90px; background: #0f1115; color: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 0.7rem; font-size: 0.95rem; font-family: var(--font-body); }
    .btn-enc { display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; text-decoration: none; text-align: center; font-weight: 700;
      font-size: 1.05rem; padding: 0.95rem 1rem; border-radius: 12px; border: 1px solid transparent; cursor: pointer; font-family: var(--font-body); }
    .btn-enc.principal { background: var(--oro); color: #15181e; }
    .btn-enc.principal:hover { background: var(--oro-claro); }
    .btn-enc.principal:disabled { background: #3a3f4a; color: #8a909b; cursor: default; }
    .btn-enc.google { background: #fff; color: #1f1f1f; }
    .btn-enc.google:hover { background: #f1f3f4; }
    .btn-enc.borde { background: transparent; color: #fff; border-color: var(--borde); }
    .btn-enc.borde:hover { border-color: var(--oro); background: rgba(212, 168, 75, 0.08); }
    .acciones { display: grid; gap: 0.6rem; margin-top: 0.75rem; }
    .error-enc { color: #ff8a7a; text-align: center; min-height: 1.2em; margin: 0.5rem 0 0; }
    .gracias-icono { font-size: 3.2rem; text-align: center; margin: 0.25rem 0; }
    .g-logo { font-weight: 800; letter-spacing: -0.5px; }
    .g-logo span:nth-child(1) { color: #4285f4; } .g-logo span:nth-child(2) { color: #ea4335; } .g-logo span:nth-child(3) { color: #fbbc05; }
    .g-logo span:nth-child(4) { color: #4285f4; } .g-logo span:nth-child(5) { color: #34a853; } .g-logo span:nth-child(6) { color: #ea4335; }
    .club-mini { display: grid; gap: 0.5rem; text-align: center; }
    .club-mini .codigo { font-family: var(--font-display); font-size: 2rem; letter-spacing: 0.08em; color: var(--oro-claro); }
    .club-mini p { margin: 0; color: var(--suave); font-size: 0.9rem; }
    .ig { display: flex; align-items: center; gap: 0.9rem; }
    .ig-icono { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 1.4rem;
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
    .ig p { margin: 0; color: var(--suave); font-size: 0.9rem; }
    .ig a { color: #fff; font-weight: 700; text-decoration: none; }
    .cargando { text-align: center; color: var(--suave); padding: 3rem 0; }
  </style>
</head>
<body>
  <main class="enc">
    <img class="enc-logo" src="assets/img/logo.png" alt="Autonova" />
    <div id="enc-contenido"><p class="cargando">Cargando…</p></div>
  </main>

  <script src="assets/vendor/supabase.min.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    // Encuesta pública: encuesta.html?e=<id>. Responde con encuesta_responder (sql/v70), una sola vez.
    const idEncuesta = new URLSearchParams(window.location.search).get('e') || '';
    const cont = document.getElementById('enc-contenido');
    const esc = (s) => htmlSeguro(String(s == null ? '' : s));
    const TEXTOS_NOTA = ['', 'Muy mal 😞', 'Mal 😕', 'Regular 😐', 'Bien 🙂', '¡Excelente! 🤩'];
    let datos = null;
    const respuesta = { nota: 0, nps: null, mejoras: new Set() };

    function bloqueInstagram(d) {
      const url = instagramUrl({ instagram: d.taller && d.taller.instagram });
      if (!url) return '';
      const usuario = '@' + url.replace(/^https:\/\/instagram\.com\//, '');
      return `<div class="panel ig"><div class="ig-icono" aria-hidden="true">📸</div><div>
        <a href="${esc(url)}" target="_blank" rel="noopener">Síguenos en Instagram ${esc(usuario)}</a>
        <p>Mecánica honesta, explicada para que entiendas qué se le hace a tu auto.</p></div></div>`;
    }

    function vistaEncuesta(d) {
      const taller = (d.taller && d.taller.nombre) || 'Autonova';
      cont.innerHTML = `
        <p class="eyebrow">${esc(taller)} · 30 segundos</p>
        <h1>${d.nombre ? `${esc(d.nombre)}, ` : ''}¿cómo te <span class="oro">fue</span>?</h1>
        <p class="sub">${d.vehiculo ? `Servicio de tu <strong>${esc(d.vehiculo)}</strong> (<span style="white-space:nowrap;">${esc(d.ot)}</span>)` : `Tu servicio <span style="white-space:nowrap;">${esc(d.ot)}</span>`}${d.fecha_entrega ? `, entregado el ${esc(fmtFecha(d.fecha_entrega))}` : ''}. Tu opinión nos ayuda a mejorar.</p>
        <div class="panel">
          <h2>¿Qué nota le pones a tu experiencia?</h2>
          <div class="estrellas" role="radiogroup" aria-label="Nota de 1 a 5">
            ${[1, 2, 3, 4, 5].map(n => `<button type="button" class="estrella" data-n="${n}" role="radio" aria-checked="false" aria-label="${n} estrella${n === 1 ? '' : 's'}">★</button>`).join('')}
          </div>
          <p class="nota-texto" id="nota-texto"></p>
        </div>
        <div class="panel">
          <h2>¿Qué tan probable es que nos recomiendes a un amigo? <small>(0 a 10)</small></h2>
          <div class="nps">${Array.from({ length: 11 }, (_, n) => `<button type="button" data-nps="${n}">${n}</button>`).join('')}</div>
          <div class="nps-leyenda"><span>Nada probable</span><span>Muy probable</span></div>
        </div>
        <div class="panel">
          <h2>¿Qué podemos mejorar? <small>(puedes marcar varias)</small></h2>
          <div class="chips">${Object.entries(MEJORAS_ENCUESTA).map(([k, t]) => `<button type="button" class="chip" data-m="${k}">${esc(t)}</button>`).join('')}</div>
        </div>
        <div class="panel">
          <h2>¿Algo más que quieras contarnos? <small>(opcional)</small></h2>
          <textarea class="coment" id="coment" maxlength="1000" placeholder="Lo que más te gustó, lo que no, una idea…"></textarea>
        </div>
        <button type="button" class="btn-enc principal" id="enviar" disabled>Enviar mi opinión</button>
        <p class="error-enc" id="error"></p>`;

      cont.querySelectorAll('.estrella').forEach(b => b.addEventListener('click', () => {
        respuesta.nota = Number(b.dataset.n);
        cont.querySelectorAll('.estrella').forEach(x => { const on = Number(x.dataset.n) <= respuesta.nota; x.classList.toggle('on', on); x.setAttribute('aria-checked', String(Number(x.dataset.n) === respuesta.nota)); });
        document.getElementById('nota-texto').textContent = TEXTOS_NOTA[respuesta.nota];
        document.getElementById('enviar').disabled = false;
      }));
      cont.querySelectorAll('.nps button').forEach(b => b.addEventListener('click', () => {
        respuesta.nps = Number(b.dataset.nps);
        cont.querySelectorAll('.nps button').forEach(x => x.classList.toggle('on', x === b));
      }));
      cont.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
        const k = b.dataset.m;
        if (respuesta.mejoras.has(k)) respuesta.mejoras.delete(k); else respuesta.mejoras.add(k);
        // «Nada, todo excelente» no se mezcla con las demás
        if (k === 'nada' && respuesta.mejoras.has('nada')) respuesta.mejoras = new Set(['nada']);
        else if (k !== 'nada') respuesta.mejoras.delete('nada');
        cont.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', respuesta.mejoras.has(x.dataset.m)));
      }));
      document.getElementById('enviar').addEventListener('click', enviar);
    }

    async function enviar() {
      const btn = document.getElementById('enviar'), err = document.getElementById('error');
      if (!respuesta.nota) { err.textContent = 'Elige de 1 a 5 estrellas.'; return; }
      btn.disabled = true; btn.textContent = 'Enviando…'; err.textContent = '';
      const { data, error } = await supabaseClient.rpc('encuesta_responder', {
        p_id: idEncuesta, p_nota: respuesta.nota, p_nps: respuesta.nps,
        p_mejoras: [...respuesta.mejoras], p_comentario: document.getElementById('coment').value.trim() || null,
      });
      if (error || !data || (!data.ok && !data.ya_respondida)) {
        btn.disabled = false; btn.textContent = 'Enviar mi opinión';
        err.textContent = (data && data.error) || 'No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.';
        return;
      }
      vistaGracias(datos, respuesta.nota);
    }

    function vistaGracias(d, nota) {
      const taller = (d.taller && d.taller.nombre) || 'Autonova';
      const contento = !nota || nota >= 4;
      // A todos se les ofrece Google (Google no permite pedírsela solo a los contentos)
      const google = d.google_url ? `
        <div class="panel" style="text-align:center;">
          <h2 style="text-align:center;">${contento ? '¿Nos regalas 1 minuto más?' : 'También puedes dejar tu opinión en Google'}</h2>
          <p style="color:var(--suave); margin:0 0 0.75rem; font-size:0.92rem;">${contento ? 'Tu reseña en Google ayuda a que más personas encuentren un taller honesto. ¡Nos ayuda muchísimo!' : 'Tu opinión pública nos ayuda a mejorar.'}</p>
          <a class="btn-enc google" id="btn-google" href="${esc(d.google_url)}" target="_blank" rel="noopener">⭐ Dejar mi reseña en <span class="g-logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></span></a>
        </div>` : '';
      const club = d.codigo ? `
        <div class="panel club-mini">
          <p class="eyebrow" style="margin:0;">Club ${esc(taller)} · Recomienda y gana</p>
          <div class="codigo">${esc(d.codigo)}</div>
          <p>Es tu código personal: tus amigos tienen ${esc(fmtPorcentaje(d.pct))}% de descuento en su primera visita${Number(d.tope) > 0 ? ` (máx. ${esc(fmtMoneda(d.tope))})` : ''} y tú ganas un cupón de ${esc(fmtPorcentaje(d.pct))}% por cada uno.</p>
          <a class="btn-enc borde" href="club.html?c=${encodeURIComponent(d.codigo)}&compartir=1">🎁 Compartir mi código</a>
        </div>` : '';
      cont.innerHTML = `
        <div class="gracias-icono">${contento ? '🙌' : '🤝'}</div>
        <h1>${contento ? '¡Gracias' : 'Gracias'}${d.nombre ? `, <span class="oro">${esc(d.nombre)}</span>` : ''}${contento ? '!' : ''}</h1>
        <p class="sub">${contento
          ? 'Nos alegra mucho que te haya ido bien. Tu opinión ya está con nosotros.'
          : 'Lamentamos que no haya sido perfecto. Ya recibimos tu opinión y <strong>te vamos a contactar</strong> para solucionarlo.'}</p>
        ${contento ? google + club : club + google}
        ${bloqueInstagram(d)}
        <div class="acciones"><a class="btn-enc borde" href="reservar.html">📅 Reservar otra hora</a></div>`;
      const g = document.getElementById('btn-google');
      if (g) g.addEventListener('click', () => { supabaseClient.rpc('encuesta_google', { p_id: idEncuesta }); });
    }

    function vistaError(texto) {
      cont.innerHTML = `<p class="eyebrow">Encuesta</p><h1>Ups</h1><p class="sub">${esc(texto)}</p>
        <div class="acciones"><a class="btn-enc principal" href="reservar.html">📅 Reservar una hora</a></div>`;
    }

    (async () => {
      if (!/^[0-9a-f-]{36}$/i.test(idEncuesta)) { vistaError('Falta el código de la encuesta en el link. Ábrelo de nuevo desde el mensaje que te enviamos.'); return; }
      const { data, error } = await supabaseClient.rpc('encuesta_info', { p_id: idEncuesta });
      if (error || !data) { vistaError('No pudimos abrir la encuesta en este momento. Intenta de nuevo en un rato.'); return; }
      if (!data.ok) { vistaError(data.error || 'No encontramos esta encuesta.'); return; }
      datos = data;
      if (data.taller && data.taller.nombre) document.title = `¿Cómo te fue? · ${data.taller.nombre}`;
      if (data.respondida) vistaGracias(data, data.nota);
      else vistaEncuesta(data);
    })();
  </script>
</body>
</html>
