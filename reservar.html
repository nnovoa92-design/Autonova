<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar hora · Autonova</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 0.5rem; }
    .slot-btn {
      padding: 0.55rem 0.4rem; text-align: center; border: 1px solid var(--color-border);
      border-radius: var(--radius); cursor: pointer; background: #fff; font-weight: 600; font-size: 0.9rem;
    }
    .slot-btn:hover { border-color: var(--color-primary); }
    .slot-btn.sel { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .trab-btn { display: block; width: 100%; text-align: left; margin: 0.3rem 0; background: #fff; color: var(--color-text); border: 1px solid var(--color-border); }
    .trab-btn.sel, .trab-btn:hover { border-color: var(--color-primary); }
    .paso { margin-top: 1rem; }
    .paso[hidden] { display: none; }
    .semana-nav { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.5rem; }
    .semana-nav strong { font-size: 0.9rem; text-align: center; }
    .dia-card { border: 1px solid var(--color-border); border-radius: var(--radius); padding: 0.7rem 0.8rem; margin: 0.5rem 0; background: #fff; }
    .dia-card h4 { margin: 0 0 0.5rem; font-size: 0.95rem; }
    .dia-card.sin-horas { background: #f6f6f7; }
    .sin-horas-txt { color: var(--color-text-muted); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.05em; }
  </style>
</head>
<body class="portal-page">
  <div class="brand-band" style="max-width:640px; width:100%; margin-bottom:1rem;">
    <img src="assets/img/logo.png" alt="Autonova" onerror="this.style.display='none'" />
    <div class="brand-band-text">
      <div class="brand-band-name" id="taller-nombre">Autonova</div>
      <div class="brand-band-sub">Reserva tu hora en el taller</div>
    </div>
  </div>

  <div class="portal-card" id="tarjeta" style="max-width:640px;">
    <p id="cargando">Cargando...</p>

    <div id="wizard" style="display:none;">
      <!-- Paso 1: servicio -->
      <div class="paso" id="p-servicio">
        <h3 style="margin-top:0;">1. ¿Qué necesitas?</h3>
        <div id="trabajos-lista"></div>
      </div>

      <!-- Paso 2: día y hora (toda la semana) -->
      <div class="paso" id="p-fecha" hidden>
        <h3>2. Elige día y hora</h3>
        <div class="semana-nav">
          <button type="button" id="sem-prev" class="btn-secondary btn-mini">← Anterior</button>
          <strong id="sem-titulo"></strong>
          <button type="button" id="sem-next" class="btn-secondary btn-mini">Siguiente →</button>
        </div>
        <div id="semana"></div>
      </div>

      <!-- Paso 3: datos -->
      <div class="paso" id="p-datos" hidden>
        <h3>3. Tus datos</h3>
        <div class="form-row">
          <div class="form-group"><label for="r-nombre">Nombre *</label><input type="text" id="r-nombre" /></div>
          <div class="form-group"><label for="r-tel">Teléfono / WhatsApp *</label><input type="tel" id="r-tel" placeholder="+56 9 ..." /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="r-patente">Patente</label><input type="text" id="r-patente" style="text-transform:uppercase;" /></div>
        </div>
        <div class="form-group"><label for="r-notas">Comentario (opcional)</label><input type="text" id="r-notas" /></div>
        <button type="button" id="reservar-btn">Confirmar reserva</button>
        <p class="error-message" id="error"></p>
      </div>
    </div>

    <!-- Confirmación -->
    <div id="confirmacion" style="display:none; text-align:center;">
      <div style="font-size:3rem;">✅</div>
      <h2>¡Reserva registrada!</h2>
      <div id="confirm-detalle" style="text-align:left; max-width:400px; margin:1rem auto;"></div>
      <p style="color:var(--color-text-muted);">El taller confirmará tu hora a la brevedad. Te contactaremos si hay algún cambio.</p>
    </div>
  </div>

  <script src="assets/vendor/supabase.min.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    const SEMANAS_MAX = 8;   // hasta cuántas semanas hacia adelante se puede reservar
    let INFO = null;
    let selTrabajo = null, selYmd = null, selSlot = null;
    let semanaDesde = null, hoy = null, semanaCargada = false;

    // Fecha de hoy en Chile (YYYY-MM-DD), sin depender de la zona horaria del dispositivo.
    const hoyChile = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Santiago' });
    // Suma días a una fecha YYYY-MM-DD (en UTC, para que el horario de verano no la corra).
    function sumarDias(ymd, n) {
      const d = new Date(`${ymd}T00:00:00Z`);
      d.setUTCDate(d.getUTCDate() + n);
      return d.toISOString().slice(0, 10);
    }
    const textoDia = (ymd, opts) => new Date(`${ymd}T12:00:00`).toLocaleDateString('es-CL', opts);

    function mostrarPaso(id) { document.getElementById(id).hidden = false; }

    function renderTrabajos() {
      document.getElementById('trabajos-lista').innerHTML = (INFO.trabajos || []).map(t =>
        `<button type="button" class="btn trab-btn" data-id="${t.id}">${t.nombre}${t.precio_fijo != null ? ` — ${fmtMoneda(t.precio_fijo)}` : ''}</button>`
      ).join('') || '<p>No hay servicios disponibles.</p>';
      document.querySelectorAll('.trab-btn').forEach(b => b.addEventListener('click', () => {
        selTrabajo = (INFO.trabajos || []).find(t => t.id === b.dataset.id);
        document.querySelectorAll('.trab-btn').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        mostrarPaso('p-fecha');
        if (!semanaCargada) cargarSemana();
        document.getElementById('p-fecha').scrollIntoView({ behavior: 'smooth' });
      }));
    }

    // Toda la semana: cada día con sus horas libres, o "SIN HORAS DISPONIBLES"
    // si está cerrado, bloqueado o ya no queda ninguna hora.
    async function cargarSemana() {
      const cont = document.getElementById('semana');
      const fin = sumarDias(semanaDesde, 6);
      document.getElementById('sem-titulo').textContent =
        `${textoDia(semanaDesde, { day: 'numeric', month: 'long' })} al ${textoDia(fin, { day: 'numeric', month: 'long' })}`;
      document.getElementById('sem-prev').disabled = semanaDesde <= hoy;
      document.getElementById('sem-next').disabled = sumarDias(semanaDesde, 7) > sumarDias(hoy, SEMANAS_MAX * 7 - 1);

      cont.innerHTML = '<p style="color:var(--color-text-muted);">Consultando disponibilidad...</p>';
      const { data, error } = await supabaseClient.rpc('reservar_semana', { p_desde: semanaDesde, p_dias: 7 });
      if (error || !Array.isArray(data)) {
        cont.innerHTML = '<p class="error-message">No se pudo consultar la disponibilidad. Intenta de nuevo o contacta al taller.</p>';
        return;
      }
      semanaCargada = true;

      cont.innerHTML = data.map(d => {
        const t = textoDia(d.fecha, { weekday: 'long', day: 'numeric', month: 'long' });
        const titulo = t.charAt(0).toUpperCase() + t.slice(1);
        if (!d.slots || !d.slots.length) {
          return `<div class="dia-card sin-horas"><h4>${titulo}</h4><span class="sin-horas-txt">SIN HORAS DISPONIBLES</span></div>`;
        }
        return `<div class="dia-card"><h4>${titulo}</h4><div class="slots-grid">${
          d.slots.map(s => `<div class="slot-btn${d.fecha === selYmd && s === selSlot ? ' sel' : ''}" data-fecha="${d.fecha}" data-slot="${s}">${s}</div>`).join('')
        }</div></div>`;
      }).join('');

      cont.querySelectorAll('.slot-btn').forEach(el => el.addEventListener('click', () => {
        cont.querySelectorAll('.slot-btn').forEach(x => x.classList.remove('sel'));
        el.classList.add('sel');
        selYmd = el.dataset.fecha;
        selSlot = el.dataset.slot;
        mostrarPaso('p-datos');
        document.getElementById('p-datos').scrollIntoView({ behavior: 'smooth' });
      }));
    }

    function cambiarSemana(dias) {
      semanaDesde = sumarDias(semanaDesde, dias);
      if (semanaDesde < hoy) semanaDesde = hoy;
      selYmd = null; selSlot = null;
      document.getElementById('p-datos').hidden = true;
      cargarSemana();
    }
    document.getElementById('sem-prev').addEventListener('click', () => cambiarSemana(-7));
    document.getElementById('sem-next').addEventListener('click', () => cambiarSemana(7));

    document.getElementById('reservar-btn').addEventListener('click', async () => {
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      const nombre = document.getElementById('r-nombre').value.trim();
      const tel = document.getElementById('r-tel').value.trim();
      if (!nombre || !tel) { errorEl.textContent = 'Completa nombre y teléfono.'; return; }
      if (!selTrabajo || !selYmd || !selSlot) { errorEl.textContent = 'Elige servicio, día y hora.'; return; }

      const btn = document.getElementById('reservar-btn');
      btn.disabled = true; btn.textContent = 'Reservando...';
      // Día y hora viajan por separado: el servidor los interpreta en hora de Chile
      // (no depende de la zona horaria del celular del cliente).
      const { data, error } = await supabaseClient.rpc('reservar_cita_v2', {
        p_nombre: nombre, p_telefono: tel,
        p_patente: document.getElementById('r-patente').value.trim() || null,
        p_fecha: selYmd, p_hora: selSlot, p_trabajo_id: selTrabajo.id,
        p_notas: document.getElementById('r-notas').value.trim() || null,
      });
      btn.disabled = false; btn.textContent = 'Confirmar reserva';
      if (error || !data || data.ok === false) {
        errorEl.textContent = (data && data.error) || 'No se pudo reservar. Intenta de nuevo.';
        if (data && data.error && /disponible|tomado/.test(data.error)) { selYmd = null; selSlot = null; cargarSemana(); }
        return;
      }
      document.getElementById('confirm-detalle').innerHTML = `
        <div class="fila" style="display:flex; justify-content:space-between; padding:0.25rem 0;"><span>Servicio</span><strong>${selTrabajo.nombre}</strong></div>
        <div class="fila" style="display:flex; justify-content:space-between; padding:0.25rem 0;"><span>Día</span><strong>${textoDia(selYmd, { weekday: 'long', day: 'numeric', month: 'long' })}</strong></div>
        <div class="fila" style="display:flex; justify-content:space-between; padding:0.25rem 0;"><span>Hora</span><strong>${selSlot} hrs</strong></div>
        <div class="fila" style="display:flex; justify-content:space-between; padding:0.25rem 0;"><span>A nombre de</span><strong>${nombre}</strong></div>`;
      document.getElementById('wizard').style.display = 'none';
      document.getElementById('confirmacion').style.display = 'block';
      document.getElementById('confirmacion').scrollIntoView({ behavior: 'smooth' });
    });

    (async () => {
      const { data, error } = await supabaseClient.rpc('reservar_info');
      if (error || !data) {
        document.getElementById('cargando').textContent = 'No se pudo cargar la reserva. Intenta más tarde o contacta al taller.';
        return;
      }
      INFO = data;
      if (data.taller && data.taller.nombre) {
        document.getElementById('taller-nombre').textContent = data.taller.nombre;
      }
      hoy = hoyChile();
      semanaDesde = hoy;
      document.getElementById('cargando').style.display = 'none';
      document.getElementById('wizard').style.display = 'block';
      renderTrabajos();
    })();
  </script>
</body>
</html>
