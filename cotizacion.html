<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cotización · Autonova</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="portal-page">
  <div class="brand-band" style="max-width:760px; width:100%; margin-bottom:1rem;">
    <img src="assets/img/logo.png" alt="Autonova" onerror="this.style.display='none'" />
    <div class="brand-band-text">
      <div class="brand-band-name" id="taller-nombre">Autonova</div>
      <div class="brand-band-sub">Revisión de cotización</div>
    </div>
  </div>

  <div class="portal-card" id="contenido">
    <p>Cargando cotización...</p>
  </div>

  <script src="assets/vendor/supabase.min.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    const cotId = new URLSearchParams(window.location.search).get('id');
    let cotData = null;

    function calcular(d) {
      const ivaPct = Number((d.taller && d.taller.iva_pct) ?? 19);
      const subtotal = (d.items || []).reduce((s, i) => s + Number(i.cantidad) * Number(i.precio_unitario), 0);
      const descuento = subtotal * (Number(d.descuento_pct || 0) / 100);
      const neto = subtotal - descuento;
      const conIva = d.con_iva !== false;
      const iva = conIva ? neto * (ivaPct / 100) : 0;
      return { ivaPct, subtotal, descuento, neto, iva, conIva, total: neto + iva };
    }

    function render(d, mensajeRespuesta) {
      cotData = d;
      if (d.taller && d.taller.nombre) document.getElementById('taller-nombre').textContent = d.taller.nombre;
      const t = calcular(d);
      const pendiente = d.estado === 'borrador' || d.estado === 'enviada';

      document.getElementById('contenido').innerHTML = `
        <div style="max-width:680px; margin:0 auto;">
          <div style="text-align:center; margin-bottom:1.5rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
              <h2 style="margin:0;">COTIZACIÓN ${fmtNumero('COT', d.numero)}</h2>
              ${badgeEstado(d.estado, ESTADOS_COTIZACION)}
            </div>
            <p style="color:var(--color-text-muted); margin:0; font-size:0.9rem;">
              <strong>${d.cliente ? d.cliente.nombre : '–'}</strong>
              ${d.vehiculo ? `<br>${d.vehiculo.patente} · ${[d.vehiculo.marca, d.vehiculo.modelo].filter(Boolean).join(' ')}` : ''}
              <br><span style="font-size:0.85rem;">Emitida: ${fmtFecha(d.fecha)} · Válida por ${d.validez_dias} días</span>
            </p>
          </div>

          <table style="width:100%; border-collapse:collapse; margin-bottom:1.5rem;">
            <thead>
              <tr style="border-bottom:2px solid var(--color-primary);">
                <th style="text-align:left; padding:0.5rem 0.5rem 0.75rem;">Descripción</th>
                <th style="text-align:center; padding:0.5rem 0.5rem 0.75rem; width:80px;">Cant.</th>
                <th style="text-align:right; padding:0.5rem 0.5rem 0.75rem; width:110px;">P. unitario</th>
                <th style="text-align:right; padding:0.5rem 0.5rem 0.75rem; width:110px;">Total</th>
              </tr>
            </thead>
            <tbody>
              ${(d.items || []).map((i, idx) => `<tr style="border-bottom:1px solid #eee; ${idx === d.items.length - 1 ? 'border-bottom:2px solid var(--color-primary);' : ''}">
                <td style="padding:0.6rem 0.5rem;">${i.descripcion}</td>
                <td style="text-align:center; padding:0.6rem 0.5rem;">${Number(i.cantidad).toLocaleString('es-CL')}</td>
                <td style="text-align:right; padding:0.6rem 0.5rem;">${fmtMoneda(i.precio_unitario)}</td>
                <td style="text-align:right; padding:0.6rem 0.5rem;"><strong>${fmtMoneda(Number(i.cantidad) * Number(i.precio_unitario))}</strong></td>
              </tr>`).join('')}
            </tbody>
          </table>

          <div style="max-width:300px; margin-left:auto; margin-right:0; margin-bottom:1.5rem;">
            <div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid #eee;"><span>Subtotal</span><span>${fmtMoneda(t.subtotal)}</span></div>
            ${t.descuento > 0 ? `<div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid #eee;"><span>Descuento (${d.descuento_pct}%)</span><span style="color:#c33;">-${fmtMoneda(t.descuento)}</span></div>` : ''}
            <div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid #eee;"><span>Neto</span><span>${fmtMoneda(t.neto)}</span></div>
            ${t.conIva ? `<div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:2px solid var(--color-primary);"><span>IVA ${t.ivaPct}%</span><span>${fmtMoneda(t.iva)}</span></div>` : ''}
            <div style="display:flex; justify-content:space-between; padding:0.6rem 0; font-weight:700; font-size:1.1rem;"><span>TOTAL</span><span style="color:var(--color-primary);">${fmtMoneda(t.total)}</span></div>
          </div>

          ${d.notas ? `<div style="background:#f9f9f9; padding:0.75rem; border-left:3px solid var(--color-primary); margin-bottom:1.5rem;"><strong>Notas:</strong> ${d.notas}</div>` : ''}

          ${mensajeRespuesta ? `
          <div style="background:#e8f5e9; padding:1rem; border-radius:4px; color:#1b5e20; font-weight:600; text-align:center; margin-bottom:1rem;">
            ${mensajeRespuesta}
            ${d.estado === 'aprobada' ? `
              <div style="margin-top:1rem; display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap;">
                <button type="button" id="agendar-btn" onclick="window.location='${window.location.origin}/reservar.html'" style="background:#1b5e20; color:#fff; border:none; padding:0.5rem 1rem; border-radius:4px; cursor:pointer; font-size:0.9rem;">📅 Agendar cita online</button>
                <button type="button" onclick="const txt='Mi cotización COT-${d.numero} fue aprobada. Necesito agendar una cita. ' + window.location; window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');" style="background:#25d366; color:#fff; border:none; padding:0.5rem 1rem; border-radius:4px; cursor:pointer; font-size:0.9rem;">💬 Avisar por WhatsApp</button>
              </div>
            ` : ''}
          </div>` : ''}

          ${pendiente && !mensajeRespuesta ? `
          <div style="display:flex; gap:0.75rem; flex-wrap:wrap; justify-content:center; margin-top:1.5rem;">
            <button type="button" id="aprobar-btn" style="padding:0.75rem 1.5rem; font-size:1rem;">✓ Aprobar cotización</button>
            <button type="button" id="rechazar-btn" class="btn-danger" style="padding:0.75rem 1.5rem; font-size:1rem;">✕ Rechazar</button>
          </div>
          <p class="error-message" id="respuesta-error"></p>` : ''}

          ${d.taller ? `<div style="text-align:center; color:var(--color-text-muted); font-size:0.8rem; margin-top:2rem; padding-top:1rem; border-top:1px solid #eee;">
            <p style="margin:0.25rem 0;"><strong>${d.taller.nombre}</strong></p>
            <p style="margin:0.1rem 0; font-size:0.75rem;">${d.taller.direccion ?? ''} · ${d.taller.telefono ?? ''}</p>
          </div>` : ''}
        </div>
      `;

      const aprobarBtn = document.getElementById('aprobar-btn');
      if (aprobarBtn) {
        aprobarBtn.addEventListener('click', () => responder('aprobada'));
        document.getElementById('rechazar-btn').addEventListener('click', () => responder('rechazada'));
      }
    }

    async function responder(respuesta) {
      const accion = respuesta === 'aprobada' ? 'aprobar' : 'rechazar';
      if (!confirm(`¿Confirmas que deseas ${accion} esta cotización?`)) return;

      const { data, error } = await supabaseClient.rpc('portal_responder_cotizacion', {
        p_id: cotId,
        p_respuesta: respuesta,
      });
      const errorEl = document.getElementById('respuesta-error');
      if (error || data !== 'ok') {
        if (errorEl) errorEl.textContent = 'No se pudo registrar tu respuesta. Contacta al taller.';
        return;
      }
      cotData.estado = respuesta;
      render(cotData, respuesta === 'aprobada'
        ? '¡Gracias! Tu aprobación quedó registrada. El taller se pondrá en contacto para coordinar.'
        : 'Tu respuesta quedó registrada. Si cambias de opinión, contacta al taller.');
    }

    (async () => {
      const contenido = document.getElementById('contenido');
      if (!cotId) {
        contenido.innerHTML = '<p class="error-message">Link inválido: falta el identificador de la cotización.</p>';
        return;
      }
      const { data, error } = await supabaseClient.rpc('portal_consultar_cotizacion', { p_id: cotId });
      if (error || !data) {
        contenido.innerHTML = '<p class="error-message">No encontramos esta cotización. Verifica el link o contacta al taller.</p>';
        return;
      }
      render(data);
    })();
  </script>
</body>
</html>
