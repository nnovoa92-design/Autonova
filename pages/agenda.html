<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda · Autonova</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .horario-grid { display: flex; flex-direction: column; }
    .horario-slot { display: flex; border-bottom: 1px solid var(--color-border); min-height: 56px; }
    .slot-hora {
      width: 68px; flex-shrink: 0; padding: 0.6rem 0.4rem;
      font-family: var(--font-display); font-weight: 600; font-size: 0.85rem;
      color: var(--color-text-muted); border-right: 2px solid var(--color-border);
      background: var(--color-surface-alt); display: flex; align-items: center;
      justify-content: center; letter-spacing: 0.5px;
    }
    .slot-content { flex: 1; padding: 0.4rem 0.75rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .slot-libre { cursor: pointer; }
    .slot-libre:hover { background: rgba(225, 52, 30, 0.05); }
    .slot-libre .add-hint {
      opacity: 0; transition: opacity 0.15s; font-size: 0.8rem; padding: 0.2rem 0.6rem;
      border-radius: var(--radius); border: 1px dashed var(--color-border); color: var(--color-primary);
    }
    .slot-libre:hover .add-hint { opacity: 1; }
    .cita-card { flex: 1; min-width: 0; }
    .cita-info { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem; font-size: 0.9rem; }
    .cita-actions { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
    .cita-continua {
      font-size: 0.8rem; font-style: italic; color: var(--color-text-muted);
      padding: 0.25rem 0.6rem; background: rgba(0,0,0,0.035); border-radius: var(--radius);
    }
    .agregar-mas-btn { flex-shrink: 0; }
    .sin-horario { padding: 2rem; text-align: center; color: var(--color-text-muted); }
    @media (max-width: 600px) {
      .slot-hora { width: 52px; font-size: 0.75rem; }
      .cita-info { font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <h1>Agenda</h1>
        <div style="display:flex; gap:0.5rem; align-items:center;">
          <button id="link-reserva-btn" class="btn-secondary">Link de reserva</button>
          <button id="nueva-btn">+ Nueva cita</button>
        </div>
      </header>
      <div class="content">

        <!-- Reservas online pendientes -->
        <div class="card" id="online-card" style="display:none; border-top:3px solid var(--color-primary);">
          <h2 style="margin-top:0;">🔔 Reservas online por confirmar</h2>
          <div id="online-body"></div>
        </div>

        <!-- Recordatorios de citas para mañana -->
        <div class="card" id="manana-card" style="display:none; border-top:3px solid var(--color-primary);">
          <h2 style="margin-top:0;">📅 Citas de mañana — recordar por WhatsApp</h2>
          <div id="manana-body"></div>
        </div>

        <!-- Formulario nueva cita -->
        <div class="card" id="form-card" style="display:none;">
          <h2 id="form-title" style="margin-top:0;">Nueva cita</h2>
          <input type="hidden" id="cita-id" />
          <div class="form-row">
            <div class="form-group">
              <label for="cliente_id">Cliente</label>
              <select id="cliente_id"></select>
            </div>
            <div class="form-group">
              <label for="vehiculo_id">Vehículo</label>
              <select id="vehiculo_id"><option value="">Sin vehículo</option></select>
            </div>
            <div class="form-group">
              <label for="trabajo_id">Trabajo / servicio</label>
              <select id="trabajo_id"><option value="">Sin especificar</option></select>
            </div>
            <div class="form-group">
              <label for="personal_id">Mecánico</label>
              <select id="personal_id"><option value="">Sin asignar</option></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="fecha">Fecha *</label>
              <input type="date" id="fecha" required />
            </div>
            <div class="form-group">
              <label for="hora">Hora *</label>
              <input type="time" id="hora" step="900" required />
            </div>
            <div class="form-group">
              <label for="duracion">Duración (min)</label>
              <input type="number" id="duracion" min="15" step="15" value="60" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="modalidad">Modalidad de atención</label>
              <select id="modalidad">
                <option value="taller">En el taller (cliente llega)</option>
                <option value="retiro">Retiro a domicilio</option>
                <option value="terreno">Trabajo en terreno</option>
              </select>
            </div>
            <div class="form-group" style="flex:2;">
              <label for="notas">Notas</label>
              <input type="text" id="notas" />
            </div>
          </div>
          <button type="button" id="guardar-btn">Guardar cita</button>
          <button type="button" id="cancelar-form-btn" class="btn-secondary">Cancelar</button>
          <p class="error-message" id="form-error"></p>
        </div>

        <!-- Vista de día -->
        <div class="card">
          <div class="toolbar">
            <div style="display:flex; gap:0.5rem; align-items:center;">
              <button id="dia-prev" class="btn-secondary">←</button>
              <input type="date" id="dia-actual" />
              <button id="dia-next" class="btn-secondary">→</button>
              <button id="dia-hoy" class="btn-secondary">Hoy</button>
            </div>
            <span id="dia-titulo" style="font-family:var(--font-display); text-transform:uppercase; font-size:1rem;"></span>
          </div>
          <div id="horario-grid"><div class="sin-horario">Cargando...</div></div>
        </div>

      </div>
    </div>
  </div>

  <script src="../assets/vendor/supabase.min.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    let clientesCache = [], vehiculosCache = [], trabajosCache = [], personalCache = [];
    let tallerHorarios = null;

    const ESTADOS_CITA = {
      pendiente:  { label: 'Pendiente',  badge: 'badge-yellow' },
      confirmado: { label: 'Confirmada', badge: 'badge-blue' },
      completado: { label: 'Completada', badge: 'badge-green' },
      cancelado:  { label: 'Cancelada',  badge: 'badge-red' },
      ausente:    { label: 'No asistió', badge: 'badge-gray' },
    };

    // Retorna "HH:MM" en la hora local del navegador (sin depender del locale)
    function fmtHora(iso) {
      const d = new Date(iso);
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // Hora de término de una cita según su duración (para mostrar cuánto ocupa el bloque).
    function fmtHoraFin(c) {
      const fin = new Date(new Date(c.fecha_hora).getTime() + (Number(c.duracion_min) || 60) * 60000);
      return `${String(fin.getHours()).padStart(2,'0')}:${String(fin.getMinutes()).padStart(2,'0')}`;
    }

    // Calcula los slots del día según horarios del taller.
    // Retorna null si el día no tiene atención (domingo sin config).
    function getSlotsDelDia(dateStr) {
      const dow = new Date(dateStr + 'T12:00:00').getDay(); // 0=dom, 6=sab
      if (dow === 0) return null; // domingo — sin atención por defecto
      const h = tallerHorarios || {};
      const slotMin  = Number(h.slot_min) || 60;
      const apertura = dow === 6 ? (h.sab_apertura || '09:00') : (h.hora_apertura || '09:00');
      const cierre   = dow === 6 ? (h.sab_cierre   || '13:00') : (h.hora_cierre   || '18:00');
      const slots = [];
      let [hh, mm] = apertura.split(':').map(Number);
      const [eh, em] = cierre.split(':').map(Number);
      while (hh < eh || (hh === eh && mm < em)) {
        slots.push(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`);
        mm += slotMin;
        if (mm >= 60) { hh += Math.floor(mm / 60); mm %= 60; }
      }
      return slots;
    }

    function actualizarVehiculos() {
      const clienteId = document.getElementById('cliente_id').value;
      const propios = vehiculosCache.filter(v => v.cliente_id === clienteId);
      document.getElementById('vehiculo_id').innerHTML =
        '<option value="">Sin vehículo</option>' +
        propios.map(v => `<option value="${v.id}">${v.patente} · ${[v.marca, v.modelo].filter(Boolean).join(' ')}</option>`).join('');
    }

    // ---------- Formulario ----------
    function abrirForm(cita) {
      document.getElementById('form-card').style.display = 'block';
      document.getElementById('form-error').textContent = '';
      if (cita) {
        document.getElementById('form-title').textContent = `Editar cita ${fmtNumero('CITA', cita.numero)}`;
        document.getElementById('cita-id').value = cita.id;
        document.getElementById('cliente_id').value = cita.cliente_id ?? '';
        actualizarVehiculos();
        document.getElementById('vehiculo_id').value = cita.vehiculo_id ?? '';
        document.getElementById('trabajo_id').value = cita.trabajo_id ?? '';
        document.getElementById('personal_id').value = cita.personal_id ?? '';
        const d = new Date(cita.fecha_hora);
        document.getElementById('fecha').value = d.toISOString().slice(0, 10);
        document.getElementById('hora').value = fmtHora(cita.fecha_hora);
        document.getElementById('duracion').value = cita.duracion_min ?? 60;
        document.getElementById('modalidad').value = cita.modalidad || 'taller';
        document.getElementById('notas').value = cita.notas ?? '';
      } else {
        document.getElementById('form-title').textContent = 'Nueva cita';
        document.getElementById('cita-id').value = '';
        document.getElementById('cliente_id').value = '';
        document.getElementById('vehiculo_id').innerHTML = '<option value="">Sin vehículo</option>';
        document.getElementById('trabajo_id').value = '';
        document.getElementById('personal_id').value = '';
        document.getElementById('fecha').value = document.getElementById('dia-actual').value || new Date().toISOString().slice(0, 10);
        document.getElementById('hora').value = '10:00';
        document.getElementById('duracion').value = String((tallerHorarios && tallerHorarios.slot_min) || 60);
        document.getElementById('modalidad').value = 'taller';
        document.getElementById('notas').value = '';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('nueva-btn').addEventListener('click', () => abrirForm(null));
    document.getElementById('cancelar-form-btn').addEventListener('click', () => document.getElementById('form-card').style.display = 'none');
    document.getElementById('cliente_id').addEventListener('change', actualizarVehiculos);

    document.getElementById('guardar-btn').addEventListener('click', async () => {
      const errorEl = document.getElementById('form-error');
      errorEl.textContent = '';
      const fecha = document.getElementById('fecha').value;
      const hora  = document.getElementById('hora').value;
      if (!fecha || !hora) { errorEl.textContent = 'Ingresa fecha y hora.'; return; }
      const fechaHora = new Date(`${fecha}T${hora}:00`).toISOString();
      const payload = {
        cliente_id:  document.getElementById('cliente_id').value  || null,
        vehiculo_id: document.getElementById('vehiculo_id').value || null,
        trabajo_id:  document.getElementById('trabajo_id').value  || null,
        personal_id: document.getElementById('personal_id').value || null,
        fecha_hora: fechaHora,
        duracion_min: Number(document.getElementById('duracion').value) || 60,
        modalidad: document.getElementById('modalidad').value || 'taller',
        notas: document.getElementById('notas').value || null,
      };
      const id = document.getElementById('cita-id').value;
      let error;
      if (id) ({ error } = await supabaseClient.from('citas').update(payload).eq('id', id));
      else     ({ error } = await supabaseClient.from('citas').insert({ ...payload, estado: 'confirmado', origen: 'interno' }));
      if (error) { errorEl.textContent = `Error: ${error.message} (¿ejecutaste sql/actualizacion-v10-agenda.sql?)`; return; }
      document.getElementById('form-card').style.display = 'none';
      document.getElementById('dia-actual').value = fecha;
      await cargar();
    });

    // ---------- Render ----------
    function nombreCliente(c) {
      if (c.clientes) return c.clientes.nombre;
      return c.nombre_contacto || '–';
    }

    function telefonoCita(c) {
      return (c.clientes && c.clientes.telefono) || c.telefono_contacto || '';
    }

    function servicioCita(c) {
      return c.trabajos ? c.trabajos.nombre : (c.descripcion || '');
    }

    // Instrucción de llegada según cómo se entrega el servicio: no tiene
    // sentido pedir "llegue antes" si vamos nosotros a buscar el vehículo
    // o el trabajo se hace en la ubicación del cliente.
    function lineaModalidad(modalidad) {
      if (modalidad === 'retiro') return 'Pasaremos a retirar su vehículo a la hora acordada. Tenga las llaves y el padrón a mano.';
      if (modalidad === 'terreno') return 'Un mecánico llegará a su ubicación a la hora acordada. Le pedimos que el vehículo esté accesible y tenga las llaves a mano.';
      return 'Le recomendamos llegar 5 minutos antes y traer su cédula.';
    }

    function fmtDuracion(horas) {
      const h = Number(horas);
      if (!h) return '';
      if (h < 1) return `${Math.round(h * 60)} minutos`;
      const enteras = Math.floor(h);
      const resto = h - enteras;
      if (resto >= 0.4 && resto <= 0.6) return `${enteras} hora${enteras !== 1 ? 's' : ''} y media`;
      if (Number.isInteger(h)) return `${h} hora${h !== 1 ? 's' : ''}`;
      return `${h} horas`;
    }

    // Busca la cotización aprobada/enviada más reciente del cliente (y del
    // mismo vehículo, si la cita tiene uno) para dar un precio de referencia.
    async function buscarPrecioEstimado(c) {
      if (!c.cliente_id) return null;
      let query = supabaseClient.from('cotizaciones')
        .select('descuento_pct, con_iva, cotizacion_items(cantidad, precio_unitario)')
        .eq('cliente_id', c.cliente_id)
        .in('estado', ['aprobada', 'enviada'])
        .order('creado_en', { ascending: false })
        .limit(1);
      if (c.vehiculo_id) query = query.eq('vehiculo_id', c.vehiculo_id);
      const { data } = await query.maybeSingle();
      if (!data) return null;
      const subtotal = (data.cotizacion_items || []).reduce((s, i) => s + Number(i.cantidad) * Number(i.precio_unitario), 0);
      const neto = subtotal * (1 - Number(data.descuento_pct || 0) / 100);
      const iva = data.con_iva !== false ? neto * Number(tallerHorarios.iva_pct || 19) / 100 : 0;
      return neto + iva;
    }

    function mensajeConfirmacionCita(c) {
      const nombre = nombreCliente(c);
      const serv = servicioCita(c);
      return `Hola ${nombre} 👋\n\nLe saluda ${tallerHorarios.nombre}. Confirmamos su cita para el ${fmtFecha(c.fecha_hora)} a las ${fmtHora(c.fecha_hora)}${serv ? ` (${serv})` : ''}.\n\n${lineaModalidad(c.modalidad)}\n\nCualquier cambio, avísenos con tiempo. ¡Le esperamos!`;
    }

    // Mensaje de recordatorio (día anterior): transparente con precio y tiempo
    // estimados, dejando claro que no se cobra nada extra sin avisar antes.
    async function mensajeRecordatorioCita(c) {
      const nombre = nombreCliente(c);
      const serv = servicioCita(c);
      const precio = await buscarPrecioEstimado(c);
      const tiempo = c.trabajos && c.trabajos.horas_estimadas ? fmtDuracion(c.trabajos.horas_estimadas) : '';

      const lineas = [
        `Hola, ${nombre} 👋`, '',
        `Le saluda el equipo de ${tallerHorarios.nombre}. Este es un recordatorio de su cita:`, '',
        `🗓️ Mañana a las ${fmtHora(c.fecha_hora)}`,
        `🔧 ${serv || 'Servicio agendado'}`, '',
        'Lo que puede esperar:',
      ];
      lineas.push(precio != null
        ? `• Presupuesto de referencia: ${fmtMoneda(precio)} (de su cotización aprobada). Si en la revisión encontramos algo adicional, se lo avisamos antes de hacerlo — nunca le cobramos sin su autorización.`
        : '• Le confirmaremos el valor una vez evaluado el vehículo. Nunca le cobramos algo sin avisarle antes.');
      if (tiempo) {
        lineas.push(`• Tiempo estimado: ${tiempo}. Un imprevisto (ej. un repuesto que no llegó del proveedor, o un hallazgo adicional) puede extender el plazo — si pasa, le avisamos apenas lo sepamos.`);
      }
      lineas.push(`• ${lineaModalidad(c.modalidad)}`, '', 'Gracias por confiar en nosotros. ¡Nos vemos mañana!');
      return lineas.join('\n');
    }

    function avisarWhatsAppCita(c, mensaje) {
      const tel = telefonoCita(c);
      if (!tel) { alert('Esta cita no tiene teléfono registrado.'); return; }
      abrirEnlace(linkWhatsApp(tel, mensaje));
    }

    function accionesCita(c) {
      let btns = '';
      if (c.estado === 'pendiente')
        btns += `<button type="button" class="btn-secondary btn-mini act" data-id="${c.id}" data-e="confirmado">Confirmar</button>`;
      if (c.estado === 'pendiente' || c.estado === 'confirmado') {
        btns += `<button type="button" class="btn-secondary btn-mini act" data-id="${c.id}" data-e="completado">Completar</button>`;
        btns += `<button type="button" class="btn-secondary btn-mini crear-ot" data-id="${c.id}">Crear OT</button>`;
        btns += `<button type="button" class="btn-danger btn-mini act" data-id="${c.id}" data-e="cancelado">Cancelar</button>`;
      }
      btns += `<button type="button" class="btn-secondary btn-mini avisar-wa" data-id="${c.id}">Avisar por WhatsApp</button>`;
      btns += `<button type="button" class="btn-secondary btn-mini editar" data-id="${c.id}">Editar</button>`;
      btns += `<button type="button" class="btn-danger btn-mini eliminar" data-id="${c.id}">Eliminar</button>`;
      return btns;
    }

    function renderCitaCard(c) {
      const veh  = c.vehiculos ? c.vehiculos.patente : (c.patente_contacto || '');
      const trab = c.trabajos  ? c.trabajos.nombre   : (c.descripcion || '');
      const mec  = personalCache.find(p => p.id === c.personal_id);
      const online = c.origen === 'online' ? ' <span class="badge badge-purple">web</span>' : '';
      return `<div class="cita-card">
        <div class="cita-info">
          ${badgeEstado(c.estado, ESTADOS_CITA)}${online}
          <strong>${nombreCliente(c)}</strong>
          ${veh  ? `<span style="color:var(--color-text-muted);">· ${veh}</span>`        : ''}
          ${trab ? `<span style="color:var(--color-text-muted);">· ${trab}</span>`       : ''}
          ${mec  ? `<span style="color:var(--color-text-muted);">· ${mec.nombre}</span>` : ''}
          ${c.telefono_contacto ? `<span style="color:var(--color-text-muted); font-size:0.82rem;">${c.telefono_contacto}</span>` : ''}
        </div>
        <div class="cita-actions">${accionesCita(c)}</div>
      </div>`;
    }

    function slotRow(slot, citas, continua) {
      const ocupado = citas.length || (continua && continua.length);
      if (!ocupado) {
        return `<div class="horario-slot">
          <div class="slot-hora">${slot}</div>
          <div class="slot-content slot-libre" data-slot="${slot}">
            <span style="flex:1; color:var(--color-text-muted); font-size:0.85rem;">Disponible</span>
            <span class="add-hint">+ Agregar</span>
          </div>
        </div>`;
      }
      const citasHtml = citas.map(renderCitaCard).join('');
      const continuaHtml = (continua || []).map(c =>
        `<div class="cita-continua">↳ ${nombreCliente(c)} (ocupado hasta las ${fmtHoraFin(c)})</div>`).join('');
      return `<div class="horario-slot">
        <div class="slot-hora">${slot}</div>
        <div class="slot-content">
          ${citasHtml}${continuaHtml}
          <button type="button" class="btn-secondary btn-mini agregar-mas-btn" data-slot="${slot}">+ Agregar</button>
        </div>
      </div>`;
    }

    let citasDia = [];
    function renderCitas() {
      const dia  = document.getElementById('dia-actual').value;
      const grid = document.getElementById('horario-grid');
      const slots = getSlotsDelDia(dia);
      const dow = new Date(dia + 'T12:00:00').getDay();

      if (slots === null) {
        // Domingo
        const extra = citasDia.length
          ? citasDia.map(c => `<div class="horario-slot"><div class="slot-hora">${fmtHora(c.fecha_hora)}</div><div class="slot-content">${renderCitaCard(c)}</div></div>`).join('')
          : '';
        grid.innerHTML = `<div class="sin-horario">Domingo — sin atención.${citasDia.length ? '<br>Hay cita(s) registrada(s) fuera de horario:' : ''}</div>${extra}`;
        if (citasDia.length) wireAcciones(grid);
        return;
      }

      // Agrupar citas por slot HH:MM
      const citasPorSlot = {};
      citasDia.forEach(c => {
        const k = fmtHora(c.fecha_hora);
        (citasPorSlot[k] = citasPorSlot[k] || []).push(c);
      });

      // Marcar los bloques siguientes que una cita larga sigue ocupando
      // (ej. una cita de 120 min con bloques de 60 min ocupa 2 filas).
      const slotMinDia = Number(tallerHorarios && tallerHorarios.slot_min) || 60;
      const continuaciones = {};
      citasDia.forEach(c => {
        const inicioIdx = slots.indexOf(fmtHora(c.fecha_hora));
        if (inicioIdx === -1) return;
        const span = Math.max(1, Math.ceil((Number(c.duracion_min) || 60) / slotMinDia));
        for (let i = 1; i < span; i++) {
          const idx = inicioIdx + i;
          if (idx >= slots.length) break;
          const k = slots[idx];
          (continuaciones[k] = continuaciones[k] || []).push(c);
        }
      });

      // Citas registradas fuera del horario calculado
      const slotSet = new Set(slots);
      const fuera = citasDia.filter(c => !slotSet.has(fmtHora(c.fecha_hora)));

      let html = '';
      if (!slots.length) {
        html = `<div class="sin-horario">Sin horario configurado para ${dow === 6 ? 'el sábado' : 'este día'}.<br>
          Revisa <a href="configuracion.html">Configuración → Horarios</a>.</div>`;
      } else {
        for (const slot of slots) {
          html += slotRow(slot, citasPorSlot[slot] || [], continuaciones[slot] || []);
        }
      }

      if (fuera.length) {
        html += `<div style="padding:0.4rem 0.75rem; font-size:0.78rem; color:var(--color-text-muted); border-top:2px solid var(--color-border);">Citas fuera de horario:</div>`;
        html += fuera.map(c => `<div class="horario-slot"><div class="slot-hora">${fmtHora(c.fecha_hora)}</div><div class="slot-content">${renderCitaCard(c)}</div></div>`).join('');
      }

      grid.innerHTML = html;

      // Click en slot libre → abre form con hora prefijada
      grid.querySelectorAll('.slot-libre').forEach(el => {
        el.addEventListener('click', () => {
          abrirForm(null);
          document.getElementById('hora').value = el.dataset.slot;
        });
      });

      // "+ Agregar" en un bloque que ya tiene cita(s) → permite otro compromiso a la misma hora
      grid.querySelectorAll('.agregar-mas-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          abrirForm(null);
          document.getElementById('hora').value = btn.dataset.slot;
        });
      });

      wireAcciones(grid);
    }

    function wireAcciones(cont) {
      cont.querySelectorAll('.act').forEach(b => b.addEventListener('click', async () => {
        const c = [...citasDia, ...onlinePendientes].find(x => x.id === b.dataset.id);
        await supabaseClient.from('citas').update({ estado: b.dataset.e }).eq('id', b.dataset.id);
        // Al confirmar, se abre WhatsApp automáticamente con el mensaje de confirmación listo para enviar.
        if (b.dataset.e === 'confirmado' && c && telefonoCita(c)) {
          avisarWhatsAppCita(c, mensajeConfirmacionCita(c));
        }
        await cargar();
      }));
      cont.querySelectorAll('.avisar-wa').forEach(b => b.addEventListener('click', () => {
        const c = [...citasDia, ...onlinePendientes].find(x => x.id === b.dataset.id);
        if (c) avisarWhatsAppCita(c, mensajeConfirmacionCita(c));
      }));
      cont.querySelectorAll('.editar').forEach(b => b.addEventListener('click', () => {
        const c = [...citasDia, ...onlinePendientes].find(x => x.id === b.dataset.id);
        if (c) abrirForm(c);
      }));
      cont.querySelectorAll('.crear-ot').forEach(b => b.addEventListener('click', () => crearOTdesdeCita(b.dataset.id)));
      cont.querySelectorAll('.eliminar').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('¿Eliminar esta cita? No se puede deshacer.')) return;
        const { error } = await supabaseClient.from('citas').delete().eq('id', b.dataset.id);
        if (error) { alert('Error: ' + error.message); return; }
        await cargar();
      }));
    }

    async function crearOTdesdeCita(citaId) {
      const c = [...citasDia, ...onlinePendientes].find(x => x.id === citaId);
      if (!c || !c.cliente_id) { alert('La cita no tiene cliente asociado.'); return; }
      if (!confirm('¿Crear una orden de trabajo desde esta cita?')) return;
      const { data: orden, error } = await supabaseClient.from('ordenes').insert({
        cliente_id: c.cliente_id, vehiculo_id: c.vehiculo_id, estado: 'recepcion',
        diagnostico: c.trabajos ? c.trabajos.nombre : (c.descripcion || c.notas), notas: c.notas,
      }).select('id, numero').single();
      if (error) { alert('Error: ' + error.message); return; }
      if (c.trabajo_id) {
        const t = trabajosCache.find(x => x.id === c.trabajo_id);
        if (t) {
          const config = await getTallerConfig();
          const precio = t.precio_fijo != null ? Number(t.precio_fijo) : Number(config.valor_hora);
          const cant   = t.precio_fijo != null ? 1 : Number(t.horas_estimadas || 1);
          await supabaseClient.from('orden_items').insert({ orden_id: orden.id, tipo: 'mano_obra', trabajo_id: t.id, descripcion: t.nombre, cantidad: cant, precio_unitario: precio, orden: 1 });
        }
      }
      await supabaseClient.from('citas').update({ estado: 'completado', orden_id: orden.id }).eq('id', citaId);
      alert(`Orden ${fmtNumero('OT', orden.numero)} creada.`);
      window.location.href = 'ordenes.html';
    }

    let onlinePendientes = [];
    async function cargarOnline() {
      const { data } = await supabaseClient
        .from('citas')
        .select('*, clientes(nombre, telefono), vehiculos(patente), trabajos(nombre, horas_estimadas)')
        .eq('origen', 'online').eq('estado', 'pendiente')
        .order('fecha_hora');
      onlinePendientes = data || [];
      const card = document.getElementById('online-card');
      if (!onlinePendientes.length) { card.style.display = 'none'; return; }
      card.style.display = 'block';
      document.getElementById('online-body').innerHTML = `<table><tbody>${onlinePendientes.map(c => `
        <tr>
          <td><strong>${fmtFecha(c.fecha_hora)} ${fmtHora(c.fecha_hora)}</strong></td>
          <td>${nombreCliente(c)}${c.telefono_contacto ? ` · ${c.telefono_contacto}` : ''}</td>
          <td>${c.trabajos ? c.trabajos.nombre : (c.descripcion || '–')}</td>
          <td>${c.patente_contacto || (c.vehiculos ? c.vehiculos.patente : '–')}</td>
          <td class="table-actions">
            <button type="button" class="btn-secondary act" data-id="${c.id}" data-e="confirmado">Confirmar</button>
            <button type="button" class="btn-danger act" data-id="${c.id}" data-e="cancelado">Rechazar</button>
            <button type="button" class="btn-secondary reenviar-wa" data-id="${c.id}">📤 Reenviar</button>
          </td>
        </tr>`).join('')}</tbody></table>`;
      wireAcciones(document.getElementById('online-body'));
      document.getElementById('online-body').querySelectorAll('.reenviar-wa').forEach(b => b.addEventListener('click', () => {
        const c = onlinePendientes.find(x => x.id === b.dataset.id);
        if (!c) return;
        const texto = `Nueva reserva online: ${nombreCliente(c)} · ${fmtFecha(c.fecha_hora)} ${fmtHora(c.fecha_hora)} · ${servicioCita(c) || 'sin servicio especificado'}${c.patente_contacto || (c.vehiculos ? c.vehiculos.patente : '') ? ` · ${c.patente_contacto || c.vehiculos.patente}` : ''}. Revisar en la agenda de Autonova.`;
        abrirEnlace('https://wa.me/?text=' + encodeURIComponent(texto));
      }));
    }

    // Citas de mañana pendientes de recordar al cliente por WhatsApp
    let mananaPendientes = [];
    async function cargarManana() {
      const manana = new Date(new Date().toISOString().slice(0, 10) + 'T12:00:00');
      manana.setDate(manana.getDate() + 1);
      const dia = manana.toISOString().slice(0, 10);
      const { data } = await supabaseClient
        .from('citas')
        .select('*, clientes(nombre, telefono), vehiculos(patente), trabajos(nombre, horas_estimadas)')
        .gte('fecha_hora', `${dia}T00:00:00`).lte('fecha_hora', `${dia}T23:59:59`)
        .in('estado', ['pendiente', 'confirmado'])
        .order('fecha_hora');
      mananaPendientes = data || [];
      const card = document.getElementById('manana-card');
      if (!mananaPendientes.length) { card.style.display = 'none'; return; }
      card.style.display = 'block';
      document.getElementById('manana-body').innerHTML = `<table><tbody>${mananaPendientes.map(c => `
        <tr>
          <td><strong>${fmtHora(c.fecha_hora)}</strong></td>
          <td>${nombreCliente(c)}${telefonoCita(c) ? ` · ${telefonoCita(c)}` : ' · sin teléfono'}</td>
          <td>${servicioCita(c) || '–'}</td>
          <td class="table-actions">
            <button type="button" class="btn-secondary recordar-wa" data-id="${c.id}" ${telefonoCita(c) ? '' : 'disabled'}>Recordar por WhatsApp</button>
          </td>
        </tr>`).join('')}</tbody></table>`;
      document.getElementById('manana-body').querySelectorAll('.recordar-wa').forEach(b => b.addEventListener('click', async () => {
        const c = mananaPendientes.find(x => x.id === b.dataset.id);
        if (c) avisarWhatsAppCita(c, await mensajeRecordatorioCita(c));
      }));
    }

    async function cargar() {
      const dia = document.getElementById('dia-actual').value;
      document.getElementById('dia-titulo').textContent =
        new Date(dia + 'T12:00:00').toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
      const desde = new Date(dia + 'T00:00:00').toISOString();
      const hasta = new Date(dia + 'T23:59:59').toISOString();
      const { data, error } = await supabaseClient
        .from('citas')
        .select('*, clientes(nombre, telefono), vehiculos(patente, marca, modelo), trabajos(nombre, horas_estimadas)')
        .gte('fecha_hora', desde).lte('fecha_hora', hasta)
        .order('fecha_hora');
      citasDia = data || [];
      renderCitas(); // siempre renderizar la grilla de slots aunque falle la query
      if (error) {
        document.getElementById('horario-grid').insertAdjacentHTML('afterbegin',
          `<div style="padding:0.5rem 0.75rem; background:#fff3cd; color:#856404; font-size:0.85rem; border-bottom:1px solid var(--color-border);">
            ⚠ Error cargando citas: ${error.message}
          </div>`);
        return;
      }
      await cargarOnline();
      await cargarManana();
    }

    document.getElementById('dia-actual').addEventListener('change', cargar);
    document.getElementById('dia-prev').addEventListener('click', () => moverDia(-1));
    document.getElementById('dia-next').addEventListener('click', () => moverDia(1));
    document.getElementById('dia-hoy').addEventListener('click', () => {
      document.getElementById('dia-actual').value = new Date().toISOString().slice(0, 10); cargar();
    });
    function moverDia(n) {
      const d = new Date(document.getElementById('dia-actual').value + 'T12:00:00');
      d.setDate(d.getDate() + n);
      document.getElementById('dia-actual').value = d.toISOString().slice(0, 10);
      cargar();
    }

    document.getElementById('link-reserva-btn').addEventListener('click', async () => {
      const url = `${window.location.origin}/reservar.html`;
      try { await navigator.clipboard.writeText(url); alert('Link de reserva copiado:\n' + url); }
      catch { prompt('Link de reserva para tus clientes:', url); }
    });

    (async () => {
      const session = await initLayout('agenda');
      if (!session) return;
      const [clientes, vehiculos, trabajos, personal, config] = await Promise.all([
        supabaseClient.from('clientes').select('id, nombre').eq('activo', true).order('nombre'),
        supabaseClient.from('vehiculos').select('*').eq('activo', true).order('patente'),
        supabaseClient.from('trabajos').select('*').eq('activo', true).order('nombre'),
        supabaseClient.from('personal').select('*').eq('activo', true).order('nombre'),
        getTallerConfig(),
      ]);
      clientesCache  = clientes.data  || [];
      vehiculosCache = vehiculos.data || [];
      trabajosCache  = trabajos.data  || [];
      personalCache  = personal.data  || [];
      tallerHorarios = config;

      document.getElementById('cliente_id').innerHTML =
        '<option value="">Sin cliente</option>' + clientesCache.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
      document.getElementById('trabajo_id').innerHTML =
        '<option value="">Sin especificar</option>' + trabajosCache.map(t => `<option value="${t.id}">${t.nombre}</option>`).join('');
      document.getElementById('personal_id').innerHTML =
        '<option value="">Sin asignar</option>' + personalCache.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');

      document.getElementById('dia-actual').value = new Date().toISOString().slice(0, 10);
      await cargar();
    })();
  </script>
</body>
</html>
