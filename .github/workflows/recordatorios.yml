name: Recordatorios automáticos por correo

on:
  schedule:
    # Todos los días a las 13:00 UTC (~09:00 en Chile). Ajustable.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Correo de prueba (opcional). Si lo pones, solo envía una prueba ahí.'
        required: false
        default: ''

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install nodemailer@6
      - name: Enviar recordatorios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: node tools/enviar-recordatorios.mjs
