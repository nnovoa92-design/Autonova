<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de trabajos · Autonova</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <h1>Catálogo de trabajos</h1>
      </header>
      <div class="content">

        <div class="card">
          <p style="margin:0 0 0.5rem; color: var(--color-text-muted); font-size:0.85rem;">
            Estos trabajos quedan precargados para elegirlos al crear cotizaciones y órdenes.
            Si un trabajo no tiene precio fijo, su precio se calcula como <strong>horas × valor hora de taller</strong>
            (<span id="valor-hora-label">–</span>).
          </p>
          <form id="categoria-form" class="form-row" style="align-items:end;">
            <div class="form-group">
              <label for="categoria-nombre">Nueva categoría</label>
              <input type="text" id="categoria-nombre" placeholder="Ej: Transmisión" required />
            </div>
            <div class="form-group" style="flex:0;">
              <button type="submit">Agregar</button>
            </div>
          </form>
          <div id="categorias-list" style="margin-top:0.5rem;"></div>
        </div>

        <div class="card" id="form-card" style="margin-top:1rem;">
          <h2 id="form-title" style="margin-top:0;">Nuevo trabajo</h2>
          <form id="trabajo-form">
            <input type="hidden" id="trabajo-id" />
            <div class="form-row">
              <div class="form-group">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" required />
              </div>
              <div class="form-group">
                <label for="categoria_id">Categoría</label>
                <select id="categoria_id"></select>
              </div>
              <div class="form-group">
                <label for="horas_estimadas">Horas de taller *</label>
                <input type="number" id="horas_estimadas" min="0" step="0.25" required />
              </div>
              <div class="form-group">
                <label for="precio_fijo">Precio fijo (opcional)</label>
                <input type="number" id="precio_fijo" min="0" step="1" placeholder="Vacío = horas × valor hora" />
              </div>
            </div>
            <div class="form-group">
              <label for="descripcion">Descripción</label>
              <textarea id="descripcion" rows="2"></textarea>
            </div>
            <button type="submit" id="submit-btn">Guardar trabajo</button>
            <button type="button" id="cancel-btn" class="btn-secondary" style="display:none;">Cancelar edición</button>
            <p class="error-message" id="form-error"></p>
          </form>
        </div>

        <div class="card" style="margin-top:1rem;">
          <div class="toolbar">
            <h2 style="margin:0;">Trabajos</h2>
            <select id="filter-categoria" style="max-width: 250px;">
              <option value="">Todas las categorías</option>
            </select>
          </div>
          <table>
            <thead>
              <tr>
                <th>Trabajo</th>
                <th>Categoría</th>
                <th>Horas</th>
                <th>Precio mano de obra</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="trabajos-body">
              <tr><td colspan="5">Cargando...</td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script src="../assets/vendor/supabase.min.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    let categoriasCache = [];
    let trabajosCache = [];
    let valorHora = 0;

    function precioTrabajo(t) {
      return t.precio_fijo != null ? Number(t.precio_fijo) : Number(t.horas_estimadas) * valorHora;
    }

    function populateCategoriaSelects() {
      const opts = categoriasCache.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
      document.getElementById('categoria_id').innerHTML = `<option value="">Sin categoría</option>${opts}`;
      document.getElementById('filter-categoria').innerHTML = `<option value="">Todas las categorías</option>${opts}`;
    }

    function renderCategorias() {
      const list = document.getElementById('categorias-list');
      list.innerHTML = categoriasCache.length
        ? categoriasCache.map(c => `<span class="badge" style="margin:0.15rem;">${c.nombre}</span>`).join('')
        : '<p style="color: var(--color-text-muted); margin:0.5rem 0 0;">No hay categorías cargadas.</p>';
    }

    async function loadCategorias() {
      const { data } = await supabaseClient.from('categorias_trabajos').select('*').order('orden');
      categoriasCache = data || [];
      populateCategoriaSelects();
      renderCategorias();
    }

    function clearForm() {
      ['trabajo-id','nombre','horas_estimadas','precio_fijo','descripcion'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('categoria_id').value = '';
      document.getElementById('form-title').textContent = 'Nuevo trabajo';
      document.getElementById('submit-btn').textContent = 'Guardar trabajo';
      document.getElementById('cancel-btn').style.display = 'none';
      document.getElementById('form-error').textContent = '';
    }

    function fillForm(t) {
      document.getElementById('trabajo-id').value = t.id;
      document.getElementById('nombre').value = t.nombre ?? '';
      document.getElementById('categoria_id').value = t.categoria_id ?? '';
      document.getElementById('horas_estimadas').value = t.horas_estimadas ?? '';
      document.getElementById('precio_fijo').value = t.precio_fijo ?? '';
      document.getElementById('descripcion').value = t.descripcion ?? '';
      document.getElementById('form-title').textContent = `Editar trabajo: ${t.nombre}`;
      document.getElementById('submit-btn').textContent = 'Actualizar trabajo';
      document.getElementById('cancel-btn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderTrabajos(trabajos) {
      const tbody = document.getElementById('trabajos-body');
      if (!trabajos.length) {
        tbody.innerHTML = '<tr><td colspan="5">No se encontraron trabajos.</td></tr>';
        return;
      }
      tbody.innerHTML = trabajos.map(t => {
        const categoria = categoriasCache.find(c => c.id === t.categoria_id);
        const fijo = t.precio_fijo != null ? '' : ' <span class="badge">calculado</span>';
        return `
        <tr>
          <td>${t.nombre}${t.descripcion ? `<br><small style="color:var(--color-text-muted);">${t.descripcion}</small>` : ''}</td>
          <td>${categoria ? categoria.nombre : '–'}</td>
          <td>${Number(t.horas_estimadas).toLocaleString('es-CL')} h</td>
          <td>${fmtMoneda(precioTrabajo(t))}${fijo}</td>
          <td class="table-actions">
            <button type="button" class="btn-secondary edit-btn" data-id="${t.id}">Editar</button>
            <button type="button" class="btn-danger delete-btn" data-id="${t.id}">Desactivar</button>
          </td>
        </tr>`;
      }).join('');

      tbody.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const t = trabajosCache.find(x => x.id === btn.dataset.id);
          if (t) fillForm(t);
        });
      });

      tbody.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('¿Desactivar este trabajo?')) return;
          const { error } = await supabaseClient.from('trabajos').update({ activo: false }).eq('id', btn.dataset.id);
          if (!error) await loadTrabajos();
        });
      });
    }

    function applyFilter() {
      const categoriaId = document.getElementById('filter-categoria').value;
      renderTrabajos(categoriaId ? trabajosCache.filter(t => t.categoria_id === categoriaId) : trabajosCache);
    }

    async function loadTrabajos() {
      const { data, error } = await supabaseClient.from('trabajos').select('*').eq('activo', true).order('nombre');
      if (error) {
        document.getElementById('trabajos-body').innerHTML = `<tr><td colspan="5">Error: ${error.message}</td></tr>`;
        return;
      }
      trabajosCache = data;
      applyFilter();
    }

    document.getElementById('filter-categoria').addEventListener('change', applyFilter);
    document.getElementById('cancel-btn').addEventListener('click', clearForm);

    document.getElementById('categoria-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('categoria-nombre').value.trim();
      if (!nombre) return;
      const { error } = await supabaseClient.from('categorias_trabajos').insert({ nombre, orden: categoriasCache.length + 1 });
      if (!error) {
        document.getElementById('categoria-nombre').value = '';
        await loadCategorias();
      }
    });

    document.getElementById('trabajo-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('form-error');
      errorEl.textContent = '';

      const id = document.getElementById('trabajo-id').value;
      const payload = {
        nombre: document.getElementById('nombre').value,
        categoria_id: document.getElementById('categoria_id').value || null,
        horas_estimadas: document.getElementById('horas_estimadas').value || 0,
        precio_fijo: document.getElementById('precio_fijo').value || null,
        descripcion: document.getElementById('descripcion').value || null,
      };

      let error;
      if (id) {
        ({ error } = await supabaseClient.from('trabajos').update(payload).eq('id', id));
      } else {
        ({ error } = await supabaseClient.from('trabajos').insert(payload));
      }

      if (error) {
        errorEl.textContent = `Error: ${error.message}`;
        return;
      }
      clearForm();
      await loadTrabajos();
    });

    (async () => {
      const session = await initLayout('trabajos');
      if (!session) return;
      const config = await getTallerConfig();
      valorHora = Number(config.valor_hora || 0);
      document.getElementById('valor-hora-label').textContent = fmtMoneda(valorHora) + ' / hora';
      await loadCategorias();
      await loadTrabajos();
    })();
  </script>
</body>
</html>
